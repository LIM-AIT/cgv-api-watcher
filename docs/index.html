<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex">
  <title>CGV WATCHER</title>
  <script>
    (() => {
      const source = new URL(window.location.href);
      const target = new URL('./app.html', source);

      // Preserve email verification / unsubscribe actions and any other
      // intentional query parameters while still forcing a fresh app document.
      target.search = source.search;
      target.searchParams.set('t', Date.now().toString());
      target.hash = source.hash;

      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <p><a href="./app.html">CGV WATCHER 열기</a></p>
</body>
</html>
