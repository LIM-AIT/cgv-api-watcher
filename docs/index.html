<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta
    name="description"
    content="CGV 특별관 예매 오픈 감시 상태 대시보드"
  >

  <title>CGV API Watcher</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #21262d;
      --surface-3: #262c36;
      --border: #30363d;

      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #58a6ff;

      --open: #3fb950;
      --wait: #d29922;
      --error: #f85149;
      --idle: #8b949e;

      --shadow:
        0 18px 48px rgba(0, 0, 0, 0.24);

      --safe-bottom:
        max(18px, env(safe-area-inset-bottom));
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          rgba(88, 166, 255, 0.14),
          transparent 34rem
        ),
        var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    .app {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        16px
        calc(96px + var(--safe-bottom));
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 22px;
    }

    .title-wrap {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      font-size: clamp(28px, 7vw, 44px);
      letter-spacing: -0.045em;
      line-height: 1.05;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .health-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(22, 27, 34, 0.9);
      box-shadow: var(--shadow);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .health-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--idle);
      box-shadow: 0 0 14px currentColor;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .summary-card {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(22, 27, 34, 0.94);
      box-shadow: var(--shadow);
    }

    .summary-label {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .summary-value {
      overflow-wrap: anywhere;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.45;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.025em;
    }

    .section-hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .theater-list {
      display: grid;
      gap: 16px;
    }

    .theater-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(22, 27, 34, 0.96);
      box-shadow: var(--shadow);
    }

    .theater-header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
    }

    .theater-name {
      margin: 0;
      font-size: 19px;
      letter-spacing: -0.025em;
    }

    .theater-code {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .result-list {
      display: grid;
    }

    .result-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 62px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: transparent;
    }

    .result-row:last-child {
      border-bottom: 0;
    }

    .result-date {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .result-main {
      min-width: 0;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 12px currentColor;
    }

    .status-label {
      min-width: 0;
      overflow: hidden;
      font-size: 14px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-open {
      color: var(--open);
    }

    .status-wait {
      color: var(--wait);
    }

    .status-error {
      color: var(--error);
    }

    .status-idle {
      color: var(--idle);
    }

    .movie-name,
    .error-message {
      margin-top: 5px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .imax-count {
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .booking-wrap {
      padding: 14px 16px 16px;
      border-top: 1px solid var(--border);
      background: rgba(13, 17, 23, 0.28);
    }

    .booking-link {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      border: 1px solid rgba(88, 166, 255, 0.38);
      border-radius: 12px;
      background:
        linear-gradient(
          180deg,
          rgba(88, 166, 255, 0.18),
          rgba(88, 166, 255, 0.1)
        );
      color: #a5d6ff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
    }

    .booking-link:active {
      transform: scale(0.99);
    }

    .loading,
    .fatal-error,
    .empty {
      padding: 30px 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    .fatal-error {
      color: var(--error);
    }

    .footer {
      margin-top: 28px;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.65;
    }

    .refresh-bar {
      position: fixed;
      z-index: 20;
      right: 0;
      bottom: 0;
      left: 0;
      padding:
        10px
        16px
        var(--safe-bottom);
      background:
        linear-gradient(
          180deg,
          rgba(13, 17, 23, 0),
          rgba(13, 17, 23, 0.94) 24%,
          rgba(13, 17, 23, 1)
        );
      pointer-events: none;
    }

    .refresh-inner {
      width: min(100%, 1080px);
      margin: 0 auto;
      pointer-events: auto;
    }

    .refresh-button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-2);
      color: var(--text);
      box-shadow: var(--shadow);
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .refresh-button:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .refresh-icon {
      font-size: 16px;
      line-height: 1;
    }

    .refresh-button.loading-state .refresh-icon {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (min-width: 760px) {
      .app {
        padding-right: 24px;
        padding-left: 24px;
      }

      .summary-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .theater-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .result-row {
        grid-template-columns: 84px minmax(0, 1fr) auto;
      }

      .refresh-bar {
        padding-right: 24px;
        padding-left: 24px;
      }

      .refresh-button {
        width: 220px;
        margin-left: auto;
      }
    }

    @media (max-width: 520px) {
      .topbar {
        display: block;
      }

      .health-badge {
        margin-top: 16px;
      }

      .subtitle {
        max-width: 32rem;
      }

      .summary-card {
        padding: 14px;
      }

      .summary-value {
        font-size: 14px;
      }

      .result-row {
        grid-template-columns: 58px minmax(0, 1fr);
      }

      .imax-count {
        grid-column: 2;
        justify-self: start;
        margin-top: -2px;
      }
    }

    @media (max-width: 360px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }

      .result-row {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .imax-count {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="title-wrap">
        <p class="eyebrow">Cloud Monitoring</p>

        <h1 class="title">
          CGV API Watcher
        </h1>

        <p class="subtitle">
          CGV 특별관 예매 일정의 최신 감시 상태를 보여줍니다.
        </p>
      </div>

      <div class="health-badge">
        <span
          id="service-dot"
          class="health-dot"
        ></span>

        <span id="service-status">
          불러오는 중
        </span>
      </div>
    </header>

    <section
      id="summary"
      class="summary-grid"
      aria-label="감시 요약"
    ></section>

    <section>
      <div class="section-header">
        <h2 class="section-title">
          극장별 감시 상태
        </h2>

        <p class="section-hint">
          60초마다 자동 갱신
        </p>
      </div>

      <div
        id="content"
        class="loading"
      >
        상태 정보를 불러오는 중입니다.
      </div>
    </section>

    <footer class="footer">
      자동 예매, 좌석 선택, 결제 기능은 수행하지 않습니다.<br>
      GitHub Actions 스케줄은 서버 상황에 따라 지연될 수 있습니다.
    </footer>
  </main>

  <div class="refresh-bar">
    <div class="refresh-inner">
      <button
        id="refresh-button"
        class="refresh-button"
        type="button"
      >
        <span class="refresh-icon">
          ↻
        </span>

        <span class="refresh-label">
          새로고침
        </span>
      </button>
    </div>
  </div>

  <script>
    const STATUS_LABELS = {
      OPEN: "예매 오픈",
      WAIT: "IMAX 미오픈",
      ERROR: "조회 오류",
      NO_SCHEDULE: "영화 일정 없음",
    };

    const STATUS_CLASSES = {
      OPEN: "status-open",
      WAIT: "status-wait",
      ERROR: "status-error",
      NO_SCHEDULE: "status-idle",
    };

    let isLoading = false;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) {
        return "-";
      }

      const [year, month, day] = value.split("-");

      if (!month || !day) {
        return value;
      }

      return `${month}/${day}`;
    }

    function formatDateRange(from, to) {
      if (!from || !to) {
        return "-";
      }

      return `${formatDate(from)} ~ ${formatDate(to)}`;
    }

    function renderSummary(data) {
      const summary = document.getElementById("summary");

      summary.innerHTML = `
        <article class="summary-card">
          <div class="summary-label">
            감시 영화
          </div>

          <div class="summary-value">
            ${escapeHtml(data.movie_keyword || "-")}
          </div>
        </article>

        <article class="summary-card">
          <div class="summary-label">
            감시 기간
          </div>

          <div class="summary-value">
            ${escapeHtml(
              formatDateRange(
                data.date_from,
                data.date_to,
              ),
            )}
          </div>
        </article>

        <article class="summary-card">
          <div class="summary-label">
            감시 극장
          </div>

          <div class="summary-value">
            ${data.theaters?.length ?? 0}개
          </div>
        </article>

        <article class="summary-card">
          <div class="summary-label">
            마지막 확인
          </div>

          <div class="summary-value">
            ${escapeHtml(
              data.checked_at_display || "-",
            )}
          </div>
        </article>
      `;
    }

    function renderResult(result) {
      const status =
        result.status || "NO_SCHEDULE";

      const statusClass =
        STATUS_CLASSES[status] || "status-idle";

      const statusLabel =
        STATUS_LABELS[status] || status;

      const movieName = result.movie_name
        ? `
          <div class="movie-name">
            ${escapeHtml(result.movie_name)}
          </div>
        `
        : "";

      const errorMessage = result.error
        ? `
          <div class="error-message">
            ${escapeHtml(result.error)}
          </div>
        `
        : "";

      const count =
        Number(result.imax_count || 0);

      const countLabel =
        count > 0
          ? `${count}건`
          : "0건";

      return `
        <div class="result-row">
          <div class="result-date">
            ${escapeHtml(
              formatDate(result.date),
            )}
          </div>

          <div class="result-main">
            <div class="status-line ${statusClass}">
              <span class="status-dot"></span>

              <span class="status-label">
                ${escapeHtml(statusLabel)}
              </span>
            </div>

            ${movieName}
            ${errorMessage}
          </div>

          <div class="imax-count">
            ${escapeHtml(countLabel)}
          </div>
        </div>
      `;
    }

    function renderTheaters(data) {
      const content =
        document.getElementById("content");

      const theaters =
        Array.isArray(data.theaters)
          ? data.theaters
          : [];

      if (!theaters.length) {
        content.className = "empty";
        content.textContent =
          "설정된 극장이 없습니다.";
        return;
      }

      content.className = "theater-list";

      content.innerHTML = theaters
        .map((theater) => {
          const results =
            Array.isArray(theater.results)
              ? theater.results
              : [];

          const resultHtml =
            results.length > 0
              ? results.map(renderResult).join("")
              : `
                <div class="result-row">
                  <div class="result-main">
                    <div class="status-line status-idle">
                      <span class="status-dot"></span>

                      <span class="status-label">
                        표시할 결과가 없습니다.
                      </span>
                    </div>
                  </div>
                </div>
              `;

          return `
            <article class="theater-card">
              <div class="theater-header">
                <h3 class="theater-name">
                  ${escapeHtml(theater.name)}
                </h3>

                <div class="theater-code">
                  Theater Code:
                  ${escapeHtml(theater.site_no)}
                </div>
              </div>

              <div class="result-list">
                ${resultHtml}
              </div>

              <div class="booking-wrap">
                <a
                  class="booking-link"
                  href="${escapeHtml(
                    theater.booking_url,
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  CGV 예매 페이지 열기
                </a>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function updateServiceStatus(data) {
      const label =
        document.getElementById(
          "service-status",
        );

      const dot =
        document.getElementById(
          "service-dot",
        );

      if (data.status === "OPEN") {
        label.textContent =
          "예매 오픈 감지";

        dot.style.background =
          "var(--open)";

        return;
      }

      if (data.status === "DEGRADED") {
        label.textContent =
          "일부 조회 오류";

        dot.style.background =
          "var(--error)";

        return;
      }

      label.textContent =
        "정상 감시 중";

      dot.style.background =
        "var(--open)";
    }

    function updateRefreshButton(
      loading,
    ) {
      const button =
        document.getElementById(
          "refresh-button",
        );

      const label =
        button.querySelector(
          ".refresh-label",
        );

      button.disabled = loading;

      button.classList.toggle(
        "loading-state",
        loading,
      );

      label.textContent =
        loading
          ? "불러오는 중"
          : "새로고침";
    }

    async function loadStatus() {
      if (isLoading) {
        return;
      }

      isLoading = true;
      updateRefreshButton(true);

      try {
        const response = await fetch(
          `status.json?timestamp=${Date.now()}`,
          {
            cache: "no-store",
          },
        );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`,
          );
        }

        const data =
          await response.json();

        renderSummary(data);
        renderTheaters(data);
        updateServiceStatus(data);
      } catch (error) {
        const content =
          document.getElementById(
            "content",
          );

        const status =
          document.getElementById(
            "service-status",
          );

        const dot =
          document.getElementById(
            "service-dot",
          );

        content.className =
          "fatal-error";

        content.textContent =
          `상태 정보를 불러오지 못했습니다: ${error.message}`;

        status.textContent =
          "데이터 오류";

        dot.style.background =
          "var(--error)";
      } finally {
        isLoading = false;
        updateRefreshButton(false);
      }
    }

    document
      .getElementById(
        "refresh-button",
      )
      .addEventListener(
        "click",
        loadStatus,
      );

    loadStatus();

    setInterval(
      loadStatus,
      60_000,
    );
  </script>
</body>
</html>
