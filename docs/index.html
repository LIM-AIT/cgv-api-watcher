<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="CGV IMAX 예매 오픈 감시 대시보드">
  <title>CGV API Watcher</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #21262d;
      --border: #30363d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #58a6ff;
      --open: #3fb950;
      --wait: #d29922;
      --error: #f85149;
      --idle: #8b949e;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.24);
      --safe-bottom: max(18px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(88, 166, 255, 0.13), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
        Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a, button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        16px
        calc(94px + var(--safe-bottom));
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      font-size: clamp(28px, 7vw, 44px);
      letter-spacing: -0.045em;
      line-height: 1.05;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .health-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(22, 27, 34, 0.9);
      box-shadow: var(--shadow);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .health-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--idle);
      box-shadow: 0 0 14px currentColor;
    }

    .live-panel {
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      padding: 20px;
      border: 1px solid rgba(88, 166, 255, 0.34);
      border-radius: 18px;
      background:
        linear-gradient(
          145deg,
          rgba(88, 166, 255, 0.12),
          rgba(22, 27, 34, 0.97) 58%
        );
      box-shadow: var(--shadow);
    }

    .live-panel.updated {
      animation: live-flash 1.1s ease;
    }

    .live-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .live-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .live-pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--open);
      box-shadow: 0 0 15px var(--open);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .live-state {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }

    .live-countdown {
      margin-bottom: 14px;
      text-align: center;
    }

    .live-countdown-label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .live-countdown-value {
      font-size: clamp(42px, 11vw, 64px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .progress-track {
      overflow: hidden;
      height: 8px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: var(--surface-2);
    }

    .progress-value {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--open));
      transition: width 1s linear;
    }

    .live-meta {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .live-meta strong {
      color: var(--text);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .live-meta .warning { color: var(--wait); }
    .live-meta .error { color: var(--error); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .summary-card {
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(22, 27, 34, 0.94);
      box-shadow: var(--shadow);
    }

    .summary-label {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .summary-value {
      overflow-wrap: anywhere;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.45;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.025em;
    }

    .section-hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .theater-list {
      display: grid;
      gap: 16px;
    }

    .theater-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(22, 27, 34, 0.96);
      box-shadow: var(--shadow);
    }

    .theater-header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
    }

    .theater-name {
      margin: 0;
      font-size: 19px;
      letter-spacing: -0.025em;
    }

    .theater-code {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .result-list { display: grid; }

    .result-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 62px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .result-row:last-child { border-bottom: 0; }

    .result-date {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .result-main { min-width: 0; }

    .status-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex-shrink: 0;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 11px currentColor;
    }

    .status-label {
      min-width: 0;
      overflow: hidden;
      font-size: 14px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-open { color: var(--open); }
    .status-wait { color: var(--wait); }
    .status-error { color: var(--error); }
    .status-idle { color: var(--idle); }

    .movie-name,
    .error-message {
      margin-top: 5px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .imax-count {
      padding: 6px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .booking-wrap {
      padding: 14px 16px 16px;
      border-top: 1px solid var(--border);
      background: rgba(13, 17, 23, 0.28);
    }

    .booking-link {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      border: 1px solid rgba(88, 166, 255, 0.38);
      border-radius: 12px;
      background:
        linear-gradient(
          180deg,
          rgba(88, 166, 255, 0.18),
          rgba(88, 166, 255, 0.1)
        );
      color: #a5d6ff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
    }

    .loading,
    .fatal-error,
    .empty {
      padding: 30px 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-align: center;
      color: var(--muted);
      line-height: 1.6;
    }

    .fatal-error { color: var(--error); }

    .footer {
      margin-top: 28px;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.65;
    }

    .refresh-bar {
      position: fixed;
      z-index: 20;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 10px 16px var(--safe-bottom);
      background:
        linear-gradient(
          180deg,
          rgba(13, 17, 23, 0),
          rgba(13, 17, 23, 0.94) 24%,
          rgba(13, 17, 23, 1)
        );
      pointer-events: none;
    }

    .refresh-inner {
      width: min(100%, 1080px);
      margin: 0 auto;
      pointer-events: auto;
    }

    .refresh-button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-2);
      color: var(--text);
      box-shadow: var(--shadow);
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .refresh-button:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .refresh-button.loading-state .refresh-icon {
      animation: spin 0.8s linear infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.72); }
    }

    @keyframes live-flash {
      0% { box-shadow: 0 0 0 rgba(63, 185, 80, 0); }
      35% { box-shadow: 0 0 34px rgba(63, 185, 80, 0.45); }
      100% { box-shadow: var(--shadow); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (min-width: 760px) {
      .app {
        padding-right: 24px;
        padding-left: 24px;
      }

      .summary-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .theater-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .result-row {
        grid-template-columns: 84px minmax(0, 1fr) auto;
      }

      .refresh-bar {
        padding-right: 24px;
        padding-left: 24px;
      }

      .refresh-button {
        width: 220px;
        margin-left: auto;
      }
    }

    @media (max-width: 520px) {
      .topbar { display: block; }
      .health-badge { margin-top: 16px; }
      .summary-card { padding: 14px; }
      .summary-value { font-size: 14px; }

      .result-row {
        grid-template-columns: 58px minmax(0, 1fr);
      }

      .imax-count {
        grid-column: 2;
        justify-self: start;
        margin-top: -2px;
      }
    }

    @media (max-width: 360px) {
      .summary-grid { grid-template-columns: 1fr; }

      .result-row {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .imax-count { grid-column: auto; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Cloud Monitoring</p>
        <h1 class="title">CGV API Watcher</h1>
        <p class="subtitle">스파이더맨 IMAX 예매 오픈 상태를 자동으로 확인합니다.</p>
      </div>

      <div class="health-badge">
        <span id="service-dot" class="health-dot"></span>
        <span id="service-status">불러오는 중</span>
      </div>
    </header>

    <section id="live-panel" class="live-panel" aria-label="실시간 감시 상태">
      <div class="live-head">
        <div class="live-title">
          <span class="live-pulse"></span>
          <span>LIVE</span>
        </div>
        <div id="live-state" class="live-state">기준 데이터를 불러오는 중</div>
      </div>

      <div class="live-countdown">
        <div class="live-countdown-label">다음 조회 예상</div>
        <div id="live-countdown" class="live-countdown-value">--:--</div>
      </div>

      <div class="progress-track">
        <div id="live-progress" class="progress-value"></div>
      </div>

      <div class="live-meta">
        <span>현재 <strong id="current-time">-</strong></span>
        <span>·</span>
        <span>마지막 <strong id="last-check-time">-</strong></span>
        <span>·</span>
        <span>데이터 <strong id="data-age">-</strong></span>
      </div>
    </section>

    <section id="summary" class="summary-grid" aria-label="감시 요약"></section>

    <section>
      <div class="section-header">
        <h2 class="section-title">극장별 감시 상태</h2>
        <p class="section-hint">새 결과 대기 중에는 5초마다 확인</p>
      </div>

      <div id="content" class="loading">
        상태 정보를 불러오는 중입니다.
      </div>
    </section>

    <footer class="footer">
      자동 예매, 좌석 선택, 결제 기능은 수행하지 않습니다.<br>
      GitHub Actions 스케줄은 서버 상황에 따라 지연될 수 있습니다.
    </footer>
  </main>

  <div class="refresh-bar">
    <div class="refresh-inner">
      <button id="refresh-button" class="refresh-button" type="button">
        <span class="refresh-icon">↻</span>
        <span class="refresh-label">새로고침</span>
      </button>
    </div>
  </div>

  <script>
    const CHECK_INTERVAL_MS = 5 * 60 * 1000;
    const WARNING_DELAY_MS = 10 * 60 * 1000;
    const ERROR_DELAY_MS = 15 * 60 * 1000;

    const STATUS_LABELS = {
      OPEN: "예매 오픈",
      WAIT: "IMAX 미오픈",
      ERROR: "조회 오류",
      NO_SCHEDULE: "영화 일정 없음",
    };

    const STATUS_CLASSES = {
      OPEN: "status-open",
      WAIT: "status-wait",
      ERROR: "status-error",
      NO_SCHEDULE: "status-idle",
    };

    let isLoading = false;
    let lastCheckedAt = null;
    let latestCheckedAtValue = null;
    let pollTimer = null;
    let liveTimer = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "-";
      const [, month, day] = value.split("-");
      return month && day ? `${month}/${day}` : value;
    }

    function formatDateRange(from, to) {
      return from && to
        ? `${formatDate(from)} ~ ${formatDate(to)}`
        : "-";
    }

    function parseCheckedAt(value) {
      if (!value) return null;
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function formatClock(date) {
      if (!date) return "-";

      return new Intl.DateTimeFormat("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
      }).format(date);
    }

    function formatElapsed(milliseconds) {
      const totalSeconds = Math.max(0, Math.floor(milliseconds / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      return minutes > 0
        ? `${minutes}분 ${String(seconds).padStart(2, "0")}초 전`
        : `${seconds}초 전`;
    }

    function renderSummary(data) {
      const summary = document.getElementById("summary");

      summary.innerHTML = `
        <article class="summary-card">
          <div class="summary-label">감시 영화</div>
          <div class="summary-value">
            ${escapeHtml(data.movie_keyword || "-")}
          </div>
        </article>

        <article class="summary-card">
          <div class="summary-label">감시 포맷</div>
          <div class="summary-value">IMAX</div>
        </article>

        <article class="summary-card">
          <div class="summary-label">감시 기간</div>
          <div class="summary-value">
            ${escapeHtml(formatDateRange(data.date_from, data.date_to))}
          </div>
        </article>

        <article class="summary-card">
          <div class="summary-label">감시 극장</div>
          <div class="summary-value">
            ${Array.isArray(data.theaters) ? data.theaters.length : 0}개
          </div>
        </article>
      `;
    }

    function renderResult(result) {
      const status = result.status || "NO_SCHEDULE";
      const statusClass = STATUS_CLASSES[status] || "status-idle";
      const statusLabel = STATUS_LABELS[status] || status;
      const count = Number(result.imax_count || 0);

      const movieName = result.movie_name
        ? `<div class="movie-name">${escapeHtml(result.movie_name)}</div>`
        : "";

      const errorMessage = result.error
        ? `<div class="error-message">${escapeHtml(result.error)}</div>`
        : "";

      return `
        <div class="result-row">
          <div class="result-date">${escapeHtml(formatDate(result.date))}</div>

          <div class="result-main">
            <div class="status-line ${statusClass}">
              <span class="status-dot"></span>
              <span class="status-label">${escapeHtml(statusLabel)}</span>
            </div>
            ${movieName}
            ${errorMessage}
          </div>

          <div class="imax-count">${count > 0 ? `${count}건` : "0건"}</div>
        </div>
      `;
    }

    function renderTheaters(data) {
      const content = document.getElementById("content");
      const theaters = Array.isArray(data.theaters) ? data.theaters : [];

      if (!theaters.length) {
        content.className = "empty";
        content.textContent = "설정된 극장이 없습니다.";
        return;
      }

      content.className = "theater-list";
      content.innerHTML = theaters.map((theater) => {
        const results = Array.isArray(theater.results) ? theater.results : [];
        const rows = results.length
          ? results.map(renderResult).join("")
          : `
            <div class="result-row">
              <div class="result-main">
                <div class="status-line status-idle">
                  <span class="status-dot"></span>
                  <span class="status-label">표시할 결과가 없습니다.</span>
                </div>
              </div>
            </div>
          `;

        return `
          <article class="theater-card">
            <div class="theater-header">
              <h3 class="theater-name">${escapeHtml(theater.name)}</h3>
              <div class="theater-code">
                Theater Code: ${escapeHtml(theater.site_no)}
              </div>
            </div>

            <div class="result-list">${rows}</div>

            <div class="booking-wrap">
              <a
                class="booking-link"
                href="${escapeHtml(theater.booking_url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                CGV 예매 페이지 열기
              </a>
            </div>
          </article>
        `;
      }).join("");
    }

    function updateServiceStatus(data) {
      const label = document.getElementById("service-status");
      const dot = document.getElementById("service-dot");

      if (data.status === "OPEN") {
        label.textContent = "예매 오픈 감지";
        dot.style.background = "var(--open)";
        return;
      }

      if (data.status === "DEGRADED") {
        label.textContent = "일부 조회 오류";
        dot.style.background = "var(--error)";
        return;
      }

      label.textContent = "정상 감시 중";
      dot.style.background = "var(--open)";
    }

    function updateRefreshButton(loading) {
      const button = document.getElementById("refresh-button");
      const label = button.querySelector(".refresh-label");

      button.disabled = loading;
      button.classList.toggle("loading-state", loading);
      label.textContent = loading ? "불러오는 중" : "새로고침";
    }

    function flashLivePanel() {
      const panel = document.getElementById("live-panel");
      panel.classList.remove("updated");
      requestAnimationFrame(() => panel.classList.add("updated"));
    }

    function setLiveReference(checkedAtValue) {
      const parsed = parseCheckedAt(checkedAtValue);

      if (!parsed) {
        lastCheckedAt = null;
        latestCheckedAtValue = null;
        updateLiveMonitor();
        scheduleNextPoll(5000);
        return;
      }

      const hasNewResult =
        latestCheckedAtValue !== null &&
        latestCheckedAtValue !== checkedAtValue;

      lastCheckedAt = parsed;
      latestCheckedAtValue = checkedAtValue;

      if (hasNewResult) flashLivePanel();

      updateLiveMonitor();
      scheduleNextPoll(getPollDelay());
    }

    function getElapsed() {
      return lastCheckedAt
        ? Math.max(0, Date.now() - lastCheckedAt.getTime())
        : Number.POSITIVE_INFINITY;
    }

    function getPollDelay() {
      return getElapsed() >= CHECK_INTERVAL_MS ? 5000 : 60000;
    }

    function scheduleNextPoll(delay) {
      if (pollTimer) clearTimeout(pollTimer);
      pollTimer = setTimeout(async () => {
        await loadStatus();
      }, delay);
    }

    function updateLiveMonitor() {
      const now = new Date();
      const currentTime = document.getElementById("current-time");
      const lastCheck = document.getElementById("last-check-time");
      const dataAge = document.getElementById("data-age");
      const countdown = document.getElementById("live-countdown");
      const progress = document.getElementById("live-progress");
      const state = document.getElementById("live-state");

      currentTime.textContent = formatClock(now);

      if (!lastCheckedAt) {
        lastCheck.textContent = "-";
        dataAge.textContent = "-";
        countdown.textContent = "--:--";
        progress.style.width = "0%";
        state.textContent = "기준 데이터 없음";
        document.title = "CGV API Watcher";
        return;
      }

      const elapsed = getElapsed();
      const remaining = CHECK_INTERVAL_MS - elapsed;

      lastCheck.textContent = formatClock(lastCheckedAt);
      dataAge.textContent = formatElapsed(elapsed);
      dataAge.classList.toggle(
        "warning",
        elapsed >= WARNING_DELAY_MS && elapsed < ERROR_DELAY_MS,
      );
      dataAge.classList.toggle("error", elapsed >= ERROR_DELAY_MS);

      if (remaining > 0) {
        const totalSeconds = Math.ceil(remaining / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        countdown.textContent =
          `${String(minutes).padStart(2, "0")}:` +
          `${String(seconds).padStart(2, "0")}`;

        progress.style.width =
          `${Math.min(100, Math.max(0, elapsed / CHECK_INTERVAL_MS * 100))}%`;

        state.textContent = "GitHub 서버의 다음 실행을 기다리는 중";
      } else {
        countdown.textContent = "00:00";
        progress.style.width = "100%";

        if (elapsed >= ERROR_DELAY_MS) {
          state.textContent = "감시 상태 확인 필요";
        } else if (elapsed >= WARNING_DELAY_MS) {
          state.textContent = "감시 실행이 지연되는 중";
        } else {
          state.textContent = "새로운 조회 결과를 기다리는 중";
        }
      }

      document.title = `${countdown.textContent} | CGV Watcher`;
    }

    async function loadStatus() {
      if (isLoading) return;

      isLoading = true;
      updateRefreshButton(true);

      try {
        const response = await fetch(
          `status.json?timestamp=${Date.now()}`,
          { cache: "no-store" },
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        renderSummary(data);
        renderTheaters(data);
        updateServiceStatus(data);
        setLiveReference(data.checked_at);
      } catch (error) {
        const content = document.getElementById("content");
        const status = document.getElementById("service-status");
        const dot = document.getElementById("service-dot");

        content.className = "fatal-error";
        content.textContent =
          `상태 정보를 불러오지 못했습니다: ${error.message}`;

        status.textContent = "데이터 오류";
        dot.style.background = "var(--error)";
        scheduleNextPoll(5000);
      } finally {
        isLoading = false;
        updateRefreshButton(false);
      }
    }

    document
      .getElementById("refresh-button")
      .addEventListener("click", loadStatus);

    liveTimer = setInterval(updateLiveMonitor, 1000);
    loadStatus();
  </script>
</body>
</html>
