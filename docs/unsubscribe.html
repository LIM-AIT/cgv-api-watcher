<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>CGV WATCHER · 알림 해지</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
    }
    main {
      width: min(100%, 520px);
      padding: 24px;
      border: 1px solid #30363d;
      border-radius: 16px;
      background: #161b22;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 18px; color: #8b949e; line-height: 1.55; }
    #imax-email-alert-status {
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      line-height: 1.5;
    }
    #imax-email-alert-status[data-type="success"] { color: #7ee787; }
    #imax-email-alert-status[data-type="error"] { color: #ff7b72; }
    #imax-email-alert-status[data-type="pending"] { color: #d2a8ff; }
    a {
      display: inline-block;
      margin-top: 18px;
      color: #58a6ff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>CGV WATCHER</h1>
    <p>선택한 영화의 예매 오픈 메일 알림만 해지합니다.</p>
    <div id="imax-email-alert-status" data-type="pending">알림 해지 요청을 확인하고 있습니다.</div>
    <a href="./">대시보드로 돌아가기</a>
  </main>
  <script type="module" src="./alerts-target-batch.js?v=2"></script>
</body>
</html>
