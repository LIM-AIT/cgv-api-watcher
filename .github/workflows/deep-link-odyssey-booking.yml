name: Deep Link Odyssey Booking

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deep-link-odyssey-booking.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point booking button to Odyssey schedule
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')

          old_results = "        const results = Array.isArray(theater.results) ? theater.results : [];\n        const rows = results.length\n"
          new_results = (
              "        const results = Array.isArray(theater.results) ? theater.results : [];\n"
              "        const openResult = results.find(\n"
              "          (result) => result?.imax_open || result?.status === \"OPEN\",\n"
              "        );\n\n"
              "        let bookingUrl = openResult?.booking_url || theater.booking_url;\n"
              "        let bookingLabel = \"CGV 예매 페이지 열기\";\n\n"
              "        if (openResult) {\n"
              "          const movieNo = data.movie_keyword === \"오디세이\" ? \"30001323\" : \"\";\n\n"
              "          if (!openResult.booking_url && movieNo && theater.site_no && openResult.date) {\n"
              "            const bookingParams = new URLSearchParams({\n"
              "              movNo: movieNo,\n"
              "              scnYmd: String(openResult.date).replaceAll(\"-\", \"\"),\n"
              "              siteNm: `CGV ${theater.name}`,\n"
              "              siteNo: String(theater.site_no),\n"
              "            });\n\n"
              "            bookingUrl = `https://cgv.co.kr/cnm/movieBook/movie?${bookingParams.toString()}`;\n"
              "          }\n\n"
              "          bookingLabel = \"오디세이 IMAX 예매 바로가기\";\n"
              "        }\n\n"
              "        const rows = results.length\n"
          )
          if old_results in text:
              text = text.replace(old_results, new_results, 1)
          elif 'bookingLabel = "오디세이 IMAX 예매 바로가기"' not in text:
              raise SystemExit('renderTheaters result block not found')

          old_href = '                href="${escapeHtml(theater.booking_url)}"'
          new_href = '                href="${escapeHtml(bookingUrl)}"'
          if old_href in text:
              text = text.replace(old_href, new_href, 1)
          elif new_href not in text:
              raise SystemExit('booking href not found')

          old_label = '                CGV 예매 페이지 열기\n'
          new_label = '                ${escapeHtml(bookingLabel)}\n'
          if old_label in text:
              text = text.replace(old_label, new_label, 1)
          elif '${escapeHtml(bookingLabel)}' not in text:
              raise SystemExit('booking label not found')

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Deep link Odyssey booking schedule [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          fi
