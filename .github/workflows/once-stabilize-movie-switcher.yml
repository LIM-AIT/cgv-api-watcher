name: One-time stabilize movie switcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/once-stabilize-movie-switcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stabilize movie target state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          switcher = Path('docs/movie-switcher.js')
          text = switcher.read_text()
          old = '  let latestData = null;\n  let selectedTarget = DEFAULT_TARGET;\n  localStorage.setItem(STORAGE_KEY, DEFAULT_TARGET);'
          new = '''  if (window.__CGV_MOVIE_SWITCHER_INITIALIZED__) return;
          window.__CGV_MOVIE_SWITCHER_INITIALIZED__ = true;

          let latestData = null;
          let selectedTarget =
            TARGET_LABELS[window.CGV_WATCHER_TARGET]
              ? window.CGV_WATCHER_TARGET
              : DEFAULT_TARGET;'''
          if old not in text:
              raise SystemExit('movie switcher init anchor not found')
          text = text.replace(old, new, 1)
          old = '    selectedTarget = targetKey;\n    localStorage.setItem(STORAGE_KEY, selectedTarget);'
          new = '    selectedTarget = targetKey;\n    window.CGV_WATCHER_TARGET = selectedTarget;\n    localStorage.setItem(STORAGE_KEY, selectedTarget);'
          if old not in text:
              raise SystemExit('movie switcher select anchor not found')
          text = text.replace(old, new, 1)
          switcher.write_text(text)

          layout = Path('docs/layout-order.js')
          text = layout.read_text()
          anchor = '  const MOVIE_SWITCHER_ASSET_ID = "movie-switcher-asset-v1";'
          addition = '''  const MOVIE_SWITCHER_ASSET_ID = "movie-switcher-asset-v1";
          const MOVIE_SELECTION_STORAGE_KEY = "cgv-watcher-selected-target-v1";
          const DEFAULT_MOVIE_TARGET = "odyssey_imax";

          // A new page always starts on Odyssey. After initialization, the
          // movie switcher owns the target state for the lifetime of the page.
          window.CGV_WATCHER_TARGET = DEFAULT_MOVIE_TARGET;
          localStorage.setItem(MOVIE_SELECTION_STORAGE_KEY, DEFAULT_MOVIE_TARGET);'''
          if anchor not in text:
              raise SystemExit('layout default target anchor not found')
          text = text.replace(anchor, addition, 1)
          if '"./movie-switcher.js?v=2"' not in text:
              raise SystemExit('movie switcher cache anchor not found')
          text = text.replace('"./movie-switcher.js?v=2"', '"./movie-switcher.js?v=3"', 1)
          layout.write_text(text)

          app = Path('docs/app.html')
          text = app.read_text()
          if './layout-order.js?v=10' not in text:
              raise SystemExit('layout cache anchor not found')
          app.write_text(text.replace('./layout-order.js?v=10', './layout-order.js?v=11', 1))
          PY

          node --check docs/movie-switcher.js
          node --check docs/layout-order.js

      - name: Publish and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/movie-switcher.js docs/layout-order.js docs/app.html
          git commit -m "Stabilize Odyssey and Spider-Man switching"
          git pull --rebase origin main
          git push origin HEAD:main

          git rm .github/workflows/once-stabilize-movie-switcher.yml
          git commit -m "Remove movie switcher helper [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
