name: Alert Routing Self Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/alert-routing-selftest.yml"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Odyssey and Spider-Man alert routing without sending mail
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "465"
          SUPABASE_URL: "https://yxrfarlhcyaaslwmdyww.supabase.co"
          DASHBOARD_URL: "https://lim-ait.github.io/cgv-api-watcher/"
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import smtplib
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          import run_multi_special as watcher
          from src.cgv_imax_watcher import subscriber_mailer_targeted as targeted

          mailer = targeted.mailer

          # 1) Watcher target / format matcher checks.
          targets = {target.key: target for target in watcher.TARGETS}
          assert set(targets) == {"odyssey_imax", "spiderman_screenx"}

          odyssey = targets["odyssey_imax"]
          spider = targets["spiderman_screenx"]

          odyssey_item = {
              "movNo": odyssey.movie_no,
              "movNm": "오디세이",
              "tcscnsGradCd": "03",
              "tcscnsGradNm": "IMAX",
              "scnsNm": "IMAX 2D",
          }
          assert watcher.movie_matches(odyssey_item, odyssey)
          assert watcher.format_matches(odyssey_item, odyssey)

          spider_variants = [
              {"movNo": spider.movie_no, "movNm": spider.movie_keyword, "tcscnsGradNm": "SCREENX"},
              {"movNo": spider.movie_no, "movNm": spider.movie_keyword, "scnsNm": "SCREENX LASER"},
              {"movNo": spider.movie_no, "movNm": spider.movie_keyword, "prodNm": "SCREENX 리클라이너"},
          ]
          for item in spider_variants:
              assert watcher.movie_matches(item, spider)
              assert watcher.format_matches(item, spider)

          # 2) Current deployed status contract contains both targets.
          status = json.loads(Path("docs/status.json").read_text(encoding="utf-8"))
          deployed_targets = status.get("targets") or {}
          assert "odyssey_imax" in deployed_targets
          assert "spiderman_screenx" in deployed_targets
          assert str(deployed_targets["odyssey_imax"].get("format", "")).upper() == "IMAX"
          assert str(deployed_targets["spiderman_screenx"].get("format", "")).upper() == "SCREENX"

          # 3) Load real encrypted subscriptions, but never print email/token/id.
          password = mailer.smtp_password()
          sender = mailer.env("SMTP_USER")
          assert sender and password
          private_key = mailer.load_private_key(
              Path(".github/secure/alert-private-key.enc.json"), password
          )
          session, base_url = mailer.supabase_session()
          try:
              rows = mailer.fetch_subscriptions(session, base_url)
              verified = []
              for row in rows:
                  email, token = mailer.decrypt_subscription(
                      private_key, str(row.get("email_ciphertext", ""))
                  )
                  target_keys = mailer.fetch_targets(
                      session, base_url, str(row.get("id", "")), token
                  )
                  if bool(row.get("verified")) and target_keys:
                      verified.append(
                          mailer.Subscription(
                              id=str(row.get("id", "")),
                              email=email,
                              token=token,
                              verified=True,
                              verified_at=row.get("verified_at"),
                              confirmation_sent_at=row.get("confirmation_sent_at"),
                              targets=target_keys,
                          )
                      )

              by_email = defaultdict(list)
              for sub in verified:
                  by_email[sub.email].append(sub)

              now = datetime.now(timezone.utc).isoformat()
              synthetic_events = [
                  mailer.OpenEvent(
                      target_key="odyssey_imax",
                      format_name="IMAX",
                      movie_no=odyssey.movie_no,
                      movie_keyword=odyssey.movie_keyword,
                      event_key="SELFTEST|ODYSSEY|IMAX",
                      signature="selftest-odyssey",
                      opened_at=now,
                      theater_name="용산아이파크몰",
                      site_no="0013",
                      target_date="2026-08-25",
                      movie_name="The Odyssey",
                      booking_url="",
                  ),
                  mailer.OpenEvent(
                      target_key="spiderman_screenx",
                      format_name="SCREENX",
                      movie_no=spider.movie_no,
                      movie_keyword=spider.movie_keyword,
                      event_key="SELFTEST|SPIDERMAN|SCREENX",
                      signature="selftest-spiderman",
                      opened_at=now,
                      theater_name="영등포타임스퀘어",
                      site_no="0059",
                      target_date="2026-08-19",
                      movie_name="스파이더맨-브랜드 뉴 데이",
                      booking_url="",
                  ),
              ]

              route_counts = {}
              for event in synthetic_events:
                  routed = []
                  for _, subscriptions in by_email.items():
                      eligible = [
                          sub for sub in subscriptions
                          if event.target_key in sub.targets
                          and mailer.event_opened_after_verification(event, sub)
                      ]
                      if eligible:
                          routed.append(eligible)

                  route_counts[event.target_key] = len(routed)
                  assert routed, f"No verified recipient route for {event.target_key}"

                  # Build the exact production alert message, but with a redacted recipient.
                  sample_subscriptions = routed[0]
                  message = mailer.alert_message(
                      sender,
                      "redacted@example.invalid",
                      event,
                      sample_subscriptions,
                  )
                  body = message.get_content()
                  assert event.format_name in str(message["Subject"])
                  assert event.movie_name in body
                  assert event.target_key in body
                  assert event.movie_no in body
                  assert "알림만 해지" in body

              # 4) Validate Gmail SMTP authentication only. No send_message call exists here.
              with smtplib.SMTP_SSL(
                  os.getenv("SMTP_HOST", "smtp.gmail.com"),
                  int(os.getenv("SMTP_PORT", "465")),
                  timeout=30,
              ) as smtp:
                  smtp.login(sender, password)

              print("ALERT SELF-TEST PASS")
              print(f"verified_subscriptions={len(verified)}")
              print(f"odyssey_routes={route_counts['odyssey_imax']}")
              print(f"spiderman_routes={route_counts['spiderman_screenx']}")
              print("watcher_imax_match=PASS")
              print("watcher_screenx_variants=PASS")
              print("message_generation=PASS")
              print("smtp_login=PASS")
              print("emails_sent=0")
          finally:
              session.close()
          PY
