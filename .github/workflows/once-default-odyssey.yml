name: One-time default Odyssey

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/once-default-odyssey.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make Odyssey the default page target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          switcher_path = Path('docs/movie-switcher.js')
          layout_path = Path('docs/layout-order.js')
          app_path = Path('docs/app.html')

          switcher = switcher_path.read_text(encoding='utf-8')
          layout = layout_path.read_text(encoding='utf-8')
          app = app_path.read_text(encoding='utf-8')

          old = '  let selectedTarget = localStorage.getItem(STORAGE_KEY) || DEFAULT_TARGET;'
          new = '  let selectedTarget = DEFAULT_TARGET;\n  localStorage.setItem(STORAGE_KEY, DEFAULT_TARGET);'
          if old not in switcher:
              raise SystemExit('selectedTarget anchor not found')
          switcher = switcher.replace(old, new, 1)

          old_asset = '    "./movie-switcher.js?v=1",'
          new_asset = '    "./movie-switcher.js?v=2",'
          if old_asset not in layout:
              raise SystemExit('movie-switcher asset version anchor not found')
          layout = layout.replace(old_asset, new_asset, 1)

          old_layout = '<script src="./layout-order.js?v=9"></script>'
          new_layout = '<script src="./layout-order.js?v=10"></script>'
          if old_layout not in app:
              raise SystemExit('layout-order cache anchor not found')
          app = app.replace(old_layout, new_layout, 1)

          switcher_path.write_text(switcher, encoding='utf-8')
          layout_path.write_text(layout, encoding='utf-8')
          app_path.write_text(app, encoding='utf-8')
          PY

          node --check docs/movie-switcher.js
          node --check docs/layout-order.js
          grep -q 'let selectedTarget = DEFAULT_TARGET' docs/movie-switcher.js
          grep -q 'localStorage.setItem(STORAGE_KEY, DEFAULT_TARGET)' docs/movie-switcher.js
          grep -q 'movie-switcher.js?v=2' docs/layout-order.js
          grep -q 'layout-order.js?v=10' docs/app.html

      - name: Publish and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/movie-switcher.js docs/layout-order.js docs/app.html
          git commit -m "Default dashboard to Odyssey"
          git pull --rebase origin main
          git push origin HEAD:main

          git pull --rebase origin main
          rm -f .github/workflows/once-default-odyssey.yml
          git add -A
          git commit -m "Remove default Odyssey helper [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
