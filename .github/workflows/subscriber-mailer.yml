name: CGV Subscriber Mailer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/subscriber-mailer.yml"

permissions:
  actions: write
  contents: read

concurrency:
  # A workflow-file push cancels any currently running subscriber mailer.
  group: cgv-subscriber-mailer-workflow_dispatch
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Subscriber alerts paused
        run: |
          echo "CGV subscriber email alerts are paused."
          echo "No subscriber emails will be sent and no self-dispatch will occur."
