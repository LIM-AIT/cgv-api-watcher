name: Enable service worker once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-service-worker-once.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump cache guard loader and remove installer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          text = p.read_text()
          old = './app-cache-guard.js?v=1'
          new = './app-cache-guard.js?v=2'
          if old not in text and new not in text:
              raise SystemExit('app-cache-guard loader not found')
          p.write_text(text.replace(old, new))
          PY
          rm .github/workflows/enable-service-worker-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html .github/workflows/enable-service-worker-once.yml
          git commit -m "Enable fresh-network service worker"
          git pull --rebase origin main
          git push origin HEAD:main
