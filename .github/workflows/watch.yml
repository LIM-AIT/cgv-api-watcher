name: CGV Watcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/watch.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: cgv-watcher-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  update-header:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update dashboard and attach realtime chat
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")

          for old in ("CGV IMAX Spider-Man", "CGV IMAX 오디세이"):
              text = text.replace(old, "CGV IMAX The Odyssey")

          if "./chat.css" not in text:
              text = text.replace(
                  "</head>",
                  '  <link rel="stylesheet" href="./chat.css?v=1">\n</head>',
              )

          if "./chat.js" not in text:
              text = text.replace(
                  "</body>",
                  '  <script type="module" src="./chat.js?v=1"></script>\n</body>',
              )

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html

          if ! git diff --cached --quiet; then
            git commit -m "Attach realtime chat to dashboard [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          else
            echo "Dashboard is already up to date."
          fi

  watch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure dashboard movie header
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")
          for old in ("CGV IMAX Spider-Man", "CGV IMAX 오디세이"):
              text = text.replace(old, "CGV IMAX The Odyssey")
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html

          if ! git diff --cached --quiet; then
            git commit -m "Keep dashboard header on The Odyssey [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          else
            echo "Dashboard header is already up to date."
          fi

      - name: Restore watcher state
        uses: actions/cache@v4
        with:
          path: state.json
          key: cgv-watcher-state-${{ github.run_id }}
          restore-keys: |
            cgv-watcher-state-

      - name: Run continuous watcher
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          THEATERS: ${{ secrets.THEATERS }}
          DATE_FROM: "2026-08-25"
          DATE_TO: "2026-09-02"
          MOVIE_KEYWORD: "오디세이"
          INTERVAL_SECONDS: "150"
          REQUEST_TIMEOUT_SECONDS: "20"
          USE_COLOR: "false"
        run: |
          set +e

          # 2분 30초 간격 × 120회 = 약 5시간
          for cycle in $(seq 1 120); do
            cycle_started=$(date +%s)

            echo "========================================"
            echo "Watcher cycle ${cycle}/120"
            echo "Started at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "========================================"

            python run.py --once
            watcher_exit=$?

            if [ "$watcher_exit" -ne 0 ]; then
              echo "Watcher failed with exit code ${watcher_exit}."
              echo "The next cycle will continue."
            fi

            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add docs/status.json

            if ! git diff --cached --quiet; then
              git commit -m "Update dashboard status [skip ci]"

              git push origin HEAD:main || {
                git pull --rebase origin main
                git push origin HEAD:main
              }
            else
              echo "No dashboard status changes."
            fi

            cycle_finished=$(date +%s)
            elapsed=$((cycle_finished - cycle_started))
            sleep_seconds=$((150 - elapsed))

            if [ "$cycle" -lt 120 ] && [ "$sleep_seconds" -gt 0 ]; then
              echo "Next check in ${sleep_seconds} seconds."
              sleep "$sleep_seconds"
            fi
          done

      - name: Save watcher state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: cgv-watcher-state-${{ github.run_id }}

      - name: Start next watcher session
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting the next continuous watcher session."

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/dispatches" \
            --data '{"ref":"main"}'
