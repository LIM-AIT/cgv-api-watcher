name: CGV Watcher

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: cgv-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore watcher state
        uses: actions/cache@v4
        with:
          path: state.json
          key: cgv-watcher-state-${{ github.run_id }}
          restore-keys: |
            cgv-watcher-state-

      - name: Run continuous watcher
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          THEATERS: ${{ secrets.THEATERS }}
          DATE_FROM: ${{ secrets.DATE_FROM }}
          DATE_TO: ${{ secrets.DATE_TO }}
          MOVIE_KEYWORD: ${{ secrets.MOVIE_KEYWORD }}
          INTERVAL_SECONDS: "150"
          REQUEST_TIMEOUT_SECONDS: "20"
          USE_COLOR: "false"
        run: |
          set +e

          # 5분 간격 × 60회 = 약 5시간
          for cycle in $(seq 1 120); do
            cycle_started=$(date +%s)

            echo "========================================"
            echo "Watcher cycle ${cycle}/120"
            echo "Started at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "========================================"

            python run.py --once
            watcher_exit=$?

            if [ "$watcher_exit" -ne 0 ]; then
              echo "Watcher failed with exit code ${watcher_exit}."
              echo "The next cycle will continue."
            fi

            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add docs/status.json

            if ! git diff --cached --quiet; then
              git commit -m "Update dashboard status [skip ci]"

              # 원격 main이 갱신된 경우 재시도
              git push origin HEAD:main || {
                git pull --rebase origin main
                git push origin HEAD:main
              }
            else
              echo "No dashboard status changes."
            fi

            cycle_finished=$(date +%s)
            elapsed=$((cycle_finished - cycle_started))
            sleep_seconds=$((150 - elapsed))

            if [ "$cycle" -lt 120 ] && [ "$sleep_seconds" -gt 0 ]; then
              echo "Next check in ${sleep_seconds} seconds."
              sleep "$sleep_seconds"
            fi
          done

      - name: Save watcher state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: cgv-watcher-state-${{ github.run_id }}

      - name: Start next watcher session
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting the next continuous watcher session."

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/dispatches" \
            --data '{"ref":"main"}'