name: CGV Watcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/watch.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: cgv-watcher-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  update-header:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Personal alerts paused
        run: echo "Personal CGV email alerts are paused."

  watch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run dashboard watcher without email alerts
        env:
          THEATERS: "용산아이파크몰:0013"
          DATE_FROM: "2026-09-16"
          DATE_TO: "2026-09-27"
          MOVIE_KEYWORD: "오디세이"
          REQUEST_TIMEOUT_SECONDS: "20"
        run: |
          set +e

          for cycle in $(seq 1 120); do
            cycle_started=$(date +%s)

            echo "========================================"
            echo "Watcher cycle ${cycle}/120 — EMAIL ALERTS PAUSED"
            echo "========================================"

            # Dashboard/status monitoring continues, but the personal notifier
            # (run.py --once) is intentionally not executed while alerts are paused.
            python run_multi_special_current.py
            multi_exit=$?

            if [ "$multi_exit" -ne 0 ]; then
              echo "Multi-target status exporter failed with exit code ${multi_exit}."
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/status.json

            if ! git diff --cached --quiet; then
              git commit -m "Update dashboard status [skip ci]"
              git push origin HEAD:main || {
                git pull --rebase origin main
                git push origin HEAD:main
              }
            fi

            cycle_finished=$(date +%s)
            elapsed=$((cycle_finished - cycle_started))
            sleep_seconds=$((150 - elapsed))
            if [ "$cycle" -lt 120 ] && [ "$sleep_seconds" -gt 0 ]; then
              sleep "$sleep_seconds"
            fi
          done

      - name: Start next watcher session
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/dispatches" \
            --data '{"ref":"main"}'
