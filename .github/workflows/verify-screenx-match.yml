name: Verify SCREENX Match

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-screenx-match.yml"

permissions:
  contents: read

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify SCREENX variant matching'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check known pre-19 Spider-Man SCREENX schedules
        env:
          THEATERS: ${{ secrets.THEATERS }}
          REQUEST_TIMEOUT_SECONDS: "20"
          PYTHONPATH: "."
        run: |
          python - <<'PY'
          from datetime import date
          import run_multi_special as m

          target = next(t for t in m.TARGETS if t.key == "spiderman_screenx")
          session = m.create_session()
          total = 0
          names = set()
          try:
              for theater in m.parse_theaters():
                  for day in (date(2026, 8, 17), date(2026, 8, 18)):
                      items, error = m.fetch_day(session, theater, day)
                      if error:
                          print(f"{theater['site_no']} {day}: api_error")
                          continue
                      movie_items = [item for item in items if m.movie_matches(item, target)]
                      screenx_items = [item for item in movie_items if m.format_matches(item, target)]
                      total += len(screenx_items)
                      for item in screenx_items:
                          names.add(m.detected_format_name(item, target))
                      print(
                          f"{theater['site_no']} {day}: "
                          f"movie_rows={len(movie_items)} screenx_rows={len(screenx_items)}"
                      )
          finally:
              session.close()

          print(f"screenx_rows_total={total}")
          print("detected_variants=" + " | ".join(sorted(names)))
          if total < 1:
              raise SystemExit("No SCREENX rows detected on validation dates")
          PY
