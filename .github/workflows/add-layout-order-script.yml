name: Add Layout Order Script

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-layout-order-script.yml"

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add layout order script to dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")
          script = '  <script src="./layout-order.js?v=1"></script>'

          if script not in text:
              needle = '  <script type="module" src="./alerts.js?v=3"></script>'
              if needle not in text:
                  raise SystemExit("alerts.js script reference not found")
              text = text.replace(needle, needle + "\n" + script, 1)
              path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html

          if ! git diff --cached --quiet; then
            git commit -m "Load swapped interactive layout [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          else
            echo "Layout order script already loaded."
          fi
