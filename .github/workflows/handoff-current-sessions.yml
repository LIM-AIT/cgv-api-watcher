name: Handoff Current Sessions

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/handoff-current-sessions.yml"

permissions:
  actions: write
  contents: read

jobs:
  handoff:
    if: github.event.head_commit.message == 'Handoff watcher and mailer to current code'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WATCH_OLD_RUN: "31536648004"
      MAIL_OLD_RUN: "31547795302"
    steps:
      - name: Cancel old long-running sessions
        run: |
          for run_id in "$WATCH_OLD_RUN" "$MAIL_OLD_RUN"; do
            curl -sS -o /dev/null -w "%{http_code}\n" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done

      - name: Wait for old sessions to stop
        run: |
          for run_id in "$WATCH_OLD_RUN" "$MAIL_OLD_RUN"; do
            for attempt in $(seq 1 30); do
              status=$(curl -sS \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                | jq -r '.status')
              echo "run ${run_id}: ${status}"
              [ "$status" = "completed" ] && break
              sleep 3
            done
          done

      - name: Ensure current watcher session exists
        run: |
          latest=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/runs?event=workflow_dispatch&per_page=1" \
            | jq -r '.workflow_runs[0].id // 0')
          if [ "$latest" = "$WATCH_OLD_RUN" ] || [ "$latest" = "0" ]; then
            curl --fail-with-body -sS \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/dispatches" \
              --data '{"ref":"main"}'
            echo "Watcher dispatched from current main."
          else
            echo "Watcher already handed off to run ${latest}."
          fi

      - name: Ensure current subscriber mailer session exists
        run: |
          latest=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/subscriber-mailer.yml/runs?event=workflow_dispatch&per_page=1" \
            | jq -r '.workflow_runs[0].id // 0')
          if [ "$latest" = "$MAIL_OLD_RUN" ] || [ "$latest" = "0" ]; then
            curl --fail-with-body -sS \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/subscriber-mailer.yml/dispatches" \
              --data '{"ref":"main"}'
            echo "Subscriber mailer dispatched from current main."
          else
            echo "Subscriber mailer already handed off to run ${latest}."
          fi
