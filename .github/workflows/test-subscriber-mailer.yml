name: Test Subscriber Mailer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-subscriber-mailer.yml"

permissions:
  contents: read

jobs:
  test-mailer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one subscriber mailer cycle
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "465"
          SUPABASE_URL: "https://yxrfarlhcyaaslwmdyww.supabase.co"
          STATUS_URL: "https://raw.githubusercontent.com/LIM-AIT/cgv-api-watcher/main/docs/status.json"
          DASHBOARD_URL: "https://lim-ait.github.io/cgv-api-watcher/"
        run: python run_subscriber_mailer.py
