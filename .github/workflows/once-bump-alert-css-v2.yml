name: One-time alert CSS cache bump

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/once-bump-alert-css-v2.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump alert CSS cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/app.html')
          text = path.read_text(encoding='utf-8')
          old = './alerts.css?v=1'
          new = './alerts.css?v=2'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old}, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          grep -q 'alerts.css?v=2' docs/app.html

      - name: Commit cache bump and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.html
          git commit -m "Load compact email alert styles v2"
          git pull --rebase origin main
          git push

          rm -f .github/workflows/once-bump-alert-css-v2.yml
          git add -A
          git commit -m "Remove alert CSS cache helper [skip ci]"
          git pull --rebase origin main
          git push
