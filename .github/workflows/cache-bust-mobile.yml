name: One-time mobile cache bust

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cache-bust-mobile.yml

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump top-level script version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          old = 'src="./header-instagram.js?v=1"'
          new = 'src="./header-instagram.js?v=2"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one cache-bust target, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/cache-bust-mobile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bust mobile script cache"
          git push origin main
