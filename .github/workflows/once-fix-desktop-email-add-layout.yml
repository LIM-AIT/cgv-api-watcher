name: One-time desktop email add layout fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/once-fix-desktop-email-add-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch desktop add-target layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          js_path = Path('docs/alerts.js')
          css_path = Path('docs/alerts.css')
          app_path = Path('docs/app.html')

          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          app = app_path.read_text(encoding='utf-8')

          button_line = '  const button = document.getElementById("imax-email-alert-button");\n'
          if button_line not in js:
              raise SystemExit('button anchor not found')
          js = js.replace(
              button_line,
              button_line + '  const form = document.getElementById("imax-email-alert-form");\n',
              1,
          )

          required_line = '  input.required = mode === "new";\n'
          if required_line not in js:
              raise SystemExit('required anchor not found')
          js = js.replace(
              required_line,
              '  if (form) form.dataset.mode = mode;\n' + required_line,
              1,
          )

          old_placeholder = '    input.placeholder = "인증된 이메일로 추가";'
          new_placeholder = '    input.placeholder = "✅ 이메일 인증 완료";'
          if old_placeholder not in js:
              raise SystemExit('add-mode placeholder anchor not found')
          js = js.replace(old_placeholder, new_placeholder, 1)

          desktop_css = r'''

          /* Desktop: verified email + add-target state. Keep all controls in the right column. */
          @media (min-width: 701px) {
            .imax-email-alert:has(.imax-email-alert-form[data-mode="add"]) .imax-email-alert-form {
              grid-column: 2;
              grid-row: 1;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 8px;
              width: 100%;
            }

            .imax-email-alert:has(.imax-email-alert-form[data-mode="add"]) .imax-email-alert-input {
              width: 100%;
              padding: 0 8px;
              border-color: rgba(63, 185, 80, 0.42);
              background: rgba(63, 185, 80, 0.08);
              color: #7ee787;
              text-align: center;
              font-size: 11px;
              font-weight: 800;
              opacity: 1;
              cursor: default;
            }

            .imax-email-alert:has(.imax-email-alert-form[data-mode="add"]) .imax-email-alert-input::placeholder {
              color: #7ee787;
              opacity: 1;
            }

            .imax-email-alert:has(.imax-email-alert-form[data-mode="add"]) .imax-email-alert-button {
              width: 100%;
              min-width: 0;
            }

            .imax-email-alert:has(.imax-email-alert-form[data-mode="add"]) .imax-email-alert-consent {
              grid-column: 2;
              grid-row: 2;
              margin-top: -4px;
            }

            .imax-email-alert:has(.imax-email-alert-form[data-mode="add"]) .imax-email-alert-status {
              display: none;
            }

            .imax-email-alert:has(.imax-email-alert-form[data-mode="add"]) #imax-email-alert-additional-button {
              grid-column: 2;
              grid-row: 3;
              justify-self: end;
              width: calc(50% - 4px) !important;
              height: 40px;
              margin: 0 !important;
              padding: 0 10px !important;
              border-color: rgba(88, 166, 255, 0.30) !important;
              background: rgba(88, 166, 255, 0.06) !important;
              color: #a5d6ff !important;
              font-size: 11px !important;
              line-height: 1.2;
              white-space: nowrap;
            }
          }
          '''
          if 'data-mode="add"' in css:
              raise SystemExit('desktop add-mode CSS already present')
          css = css.rstrip() + desktop_css + '\n'

          if './alerts.css?v=2' not in app:
              raise SystemExit('alerts.css v2 reference not found')
          if './alerts.js?v=6' not in app:
              raise SystemExit('alerts.js v6 reference not found')
          app = app.replace('./alerts.css?v=2', './alerts.css?v=3', 1)
          app = app.replace('./alerts.js?v=6', './alerts.js?v=7', 1)

          js_path.write_text(js, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          app_path.write_text(app, encoding='utf-8')
          PY

          node --check docs/alerts.js
          grep -q 'data-mode="add"' docs/alerts.css
          grep -q 'alerts.css?v=3' docs/app.html
          grep -q 'alerts.js?v=7' docs/app.html

      - name: Publish and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/alerts.js docs/alerts.css docs/app.html
          git commit -m "Fix desktop email add-target layout"
          git pull --rebase origin main
          git push origin HEAD:main

          git pull --rebase origin main
          rm -f .github/workflows/once-fix-desktop-email-add-layout.yml
          git add -A
          git commit -m "Remove desktop email layout helper [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
