name: Refresh Mobile Chat CSS

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bump-chat-css-v4.yml"

permissions:
  contents: write

jobs:
  bump-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump chat CSS cache version
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")
          updated = text.replace('chat.css?v=3', 'chat.css?v=4')
          if updated == text:
              print("chat.css cache version already updated")
          else:
              path.write_text(updated, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Bump chat CSS cache version [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          fi
