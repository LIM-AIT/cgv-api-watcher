name: Email Date Deeplink

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/email-date-deeplink.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add date-specific Odyssey booking link to alert email
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/cgv_imax_watcher/subscriber_mailer_v2.py")
          text = path.read_text(encoding="utf-8")

          if 'ODYSSEY_MOVIE_NO = "30001323"' not in text:
              text = text.replace(
                  'IMAX_GRADE_CODE = "03"\n',
                  'IMAX_GRADE_CODE = "03"\nODYSSEY_MOVIE_NO = "30001323"\n',
                  1,
              )

          if 'def event_booking_url(event: OpenEvent) -> str:' not in text:
              marker = '\n\ndef action_url(param: str, subscriptions: list[Subscription]) -> str:\n'
              helper = '''\n\ndef event_booking_url(event: OpenEvent) -> str:\n    if not event.site_no or not event.target_date:\n        return event.booking_url\n\n    params = urlencode(\n        {\n            "movNo": ODYSSEY_MOVIE_NO,\n            "scnYmd": event.target_date.replace("-", ""),\n            "siteNm": f"CGV {event.theater_name}",\n            "siteNo": event.site_no,\n        }\n    )\n    return f"https://cgv.co.kr/cnm/movieBook/movie?{params}"\n'''
              if marker not in text:
                  raise SystemExit("action_url marker not found")
              text = text.replace(marker, helper + marker, 1)

          old_date = '    date_label = format_date_label(event.target_date)\n    message = EmailMessage()\n'
          new_date = '    date_label = format_date_label(event.target_date)\n    booking_url = event_booking_url(event)\n    message = EmailMessage()\n'
          if old_date in text:
              text = text.replace(old_date, new_date, 1)

          text = text.replace(
              '        "CGV 예매 페이지:\\n"\n        f"{event.booking_url}\\n\\n"\n',
              '        "오디세이 IMAX 바로 예매하기:\\n"\n        f"{booking_url}\\n\\n"\n',
              1,
          )

          if 'f"{event.booking_url}\\n\\n"' in text:
              raise SystemExit("generic booking URL still used in alert email")
          if 'booking_url = event_booking_url(event)' not in text:
              raise SystemExit("date-specific booking URL not wired")

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile src/cgv_imax_watcher/subscriber_mailer_v2.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cgv_imax_watcher/subscriber_mailer_v2.py
          if ! git diff --cached --quiet; then
            git commit -m "Use date-specific Odyssey booking links in email alerts [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          fi
