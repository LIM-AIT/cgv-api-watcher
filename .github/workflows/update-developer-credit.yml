name: Update Developer Credit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-developer-credit.yml"

permissions:
  contents: write

jobs:
  update-credit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update developer credit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")

          old_escaped = r"\uac1c\ubc1c\uc790 : \uc784\uc6b0\uc0c1"
          new_label = "Developed & Maintained by Woosang Lim"

          text = text.replace(old_escaped, new_label)
          text = text.replace("개발자 : 임우상", new_label)
          text = text.replace("개발자: 임우상", new_label)

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html

          if ! git diff --cached --quiet; then
            git commit -m "Use professional English developer credit [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          else
            echo "Developer credit already updated."
          fi
