name: Update Chat Title V1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-chat-title-v1.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Update chat title v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update chat title and cache version
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('docs/chat.js')
          text = chat.read_text(encoding='utf-8')
          old = '<h2>💬 IMAX 실시간 채팅</h2>'
          new = '<h2>💬 꿀좌석 선점을 위한 실시간 채팅</h2>'
          if old not in text and new not in text:
              raise SystemExit('chat title target not found')
          text = text.replace(old, new, 1)
          chat.write_text(text, encoding='utf-8')

          index = Path('docs/index.html')
          html = index.read_text(encoding='utf-8')
          old_ref = './chat.js?v=5'
          new_ref = './chat.js?v=6'
          if old_ref not in html and new_ref not in html:
              raise SystemExit('chat asset reference not found')
          html = html.replace(old_ref, new_ref, 1)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chat.js docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update realtime chat title [skip ci]"
            git push origin HEAD:main
          fi
