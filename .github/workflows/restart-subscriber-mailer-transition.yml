name: Restart Subscriber Mailer Transition

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restart-subscriber-mailer-transition.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: cgv-subscriber-mailer-workflow_dispatch
  cancel-in-progress: true

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Start mailer with transition-only alert logic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/subscriber-mailer.yml/dispatches" \
            --data '{"ref":"main"}'
