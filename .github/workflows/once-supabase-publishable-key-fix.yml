name: One-time Supabase publishable key fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/once-supabase-publishable-key-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch subscriber mailer Supabase client
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/cgv_imax_watcher/subscriber_mailer_v3.py')
          text = path.read_text(encoding='utf-8')

          old_key = '''DEFAULT_SUPABASE_ANON_KEY = (
              "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9."
              "eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4cmZhcmxoY3lhYXNsd21keXd3Iiw"
              "icm9sZSI6ImFub24iLCJpYXQiOjE3NzE5OTk2NDksImV4cCI6MjA4NzU3NTY0OX0."
              "z7_2YgAz2HetxJ2dYV54WfLM_3TQMe8YtH1oq_p-k-Q"
          )'''
          new_key = '''DEFAULT_SUPABASE_PUBLISHABLE_KEY = (
              "sb_publishable_XPhr82oODoaWs_uYrWiXGg_Y1ypkJmC"
          )'''

          old_session = '''    key = env("SUPABASE_ANON_KEY", DEFAULT_SUPABASE_ANON_KEY)
              session = requests.Session()
              session.headers.update(
                  {
                      "apikey": key,
                      "Authorization": f"Bearer {key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "cgv-api-watcher-subscriber-mailer/3.0",
                  }
              )'''
          new_session = '''    key = (
                  env("SUPABASE_PUBLISHABLE_KEY")
                  or env("SUPABASE_ANON_KEY")
                  or DEFAULT_SUPABASE_PUBLISHABLE_KEY
              )
              session = requests.Session()
              headers = {
                  "apikey": key,
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "cgv-api-watcher-subscriber-mailer/3.1",
              }
              # Legacy anon keys are JWTs and may be used as Bearer tokens.
              # New sb_publishable keys must be sent as API keys, not JWTs.
              if key.startswith("eyJ"):
                  headers["Authorization"] = f"Bearer {key}"
              session.headers.update(headers)'''

          for old, new, label in (
              (old_key, new_key, 'key block'),
              (old_session, new_session, 'session block'),
          ):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected 1 {label}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and cleanup diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/once-supabase-publishable-key-fix.yml
          rm -f .github/workflows/once-email-identity-diagnostic.yml
          git add -A
          git commit -m "Use Supabase publishable key in subscriber mailer [skip ci]"
          git push
