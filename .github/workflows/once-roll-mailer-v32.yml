name: One-time roll subscriber mailer v3.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/once-roll-mailer-v32.yml

permissions:
  actions: write
  contents: write

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cancel previous subscriber mailer session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --output /tmp/cancel.out --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31791766999/cancel")
          cat /tmp/cancel.out || true
          if [ "$status" != "202" ] && [ "$status" != "409" ]; then
            echo "Unexpected cancel status: $status"
            exit 1
          fi
      - name: Remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/once-roll-mailer-v32.yml
          git add -A
          git commit -m "Remove subscriber mailer rollover helper [skip ci]"
          git push
