name: One-time alerts cache bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/once-alerts-cache-bump.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump alerts module version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/app.html')
          text = path.read_text(encoding='utf-8')
          old = './alerts.js?v=4'
          new = './alerts.js?v=5'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one {old!r} reference')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/once-alerts-cache-bump.yml
          git add -A
          git commit -m "Bump email alert module cache version [skip ci]"
          git push
