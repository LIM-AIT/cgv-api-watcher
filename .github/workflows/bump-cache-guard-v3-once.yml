name: Bump cache guard v3 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-cache-guard-v3-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump app cache guard URL
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#app-cache-guard.js?v=2#app-cache-guard.js?v=3#g' docs/app.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.html
          git commit -m "Load cache guard v3"
          git pull --rebase origin main
          git push origin HEAD:main
