name: Send Owner Alert Self-Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/send-owner-alert-selftest.yml"

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Odyssey and Spider-Man test alerts to owner
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "465"
          DASHBOARD_URL: "https://lim-ait.github.io/cgv-api-watcher/"
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          import smtplib

          import run_multi_special as watcher
          from src.cgv_imax_watcher import subscriber_mailer_targeted as targeted

          mailer = targeted.mailer
          targets = {target.key: target for target in watcher.TARGETS}
          odyssey = targets["odyssey_imax"]
          spider = targets["spiderman_screenx"]

          sender = mailer.env("SMTP_USER")
          password = mailer.smtp_password()
          if not sender or not password:
              raise RuntimeError("SMTP credentials are missing")

          now = datetime.now(timezone.utc).isoformat()
          dummy_odyssey_sub = mailer.Subscription(
              id="selftest-odyssey",
              email=sender,
              token="selftest-token",
              verified=True,
              verified_at=now,
              confirmation_sent_at=now,
              targets=frozenset({"odyssey_imax"}),
          )
          dummy_spider_sub = mailer.Subscription(
              id="selftest-spiderman",
              email=sender,
              token="selftest-token",
              verified=True,
              verified_at=now,
              confirmation_sent_at=now,
              targets=frozenset({"spiderman_screenx"}),
          )

          events = [
              (
                  mailer.OpenEvent(
                      target_key="odyssey_imax",
                      format_name="IMAX",
                      movie_no=odyssey.movie_no,
                      movie_keyword=odyssey.movie_keyword,
                      event_key="SELFTEST|ODYSSEY|IMAX",
                      signature="selftest-odyssey",
                      opened_at=now,
                      theater_name="용산아이파크몰",
                      site_no="0013",
                      target_date="2026-08-25",
                      movie_name="The Odyssey",
                      booking_url="",
                  ),
                  [dummy_odyssey_sub],
              ),
              (
                  mailer.OpenEvent(
                      target_key="spiderman_screenx",
                      format_name="SCREENX",
                      movie_no=spider.movie_no,
                      movie_keyword=spider.movie_keyword,
                      event_key="SELFTEST|SPIDERMAN|SCREENX",
                      signature="selftest-spiderman",
                      opened_at=now,
                      theater_name="영등포타임스퀘어",
                      site_no="0059",
                      target_date="2026-08-19",
                      movie_name="스파이더맨-브랜드 뉴 데이",
                      booking_url="",
                  ),
                  [dummy_spider_sub],
              ),
          ]

          messages = []
          for event, subs in events:
              message = mailer.alert_message(sender, sender, event, subs)
              message.replace_header("Subject", f"[TEST] {message['Subject']}")
              original = message.get_content()
              message.set_content(
                  "[CGV WATCHER 운영 메일 테스트]\n"
                  "이 메일은 실제 예매 오픈 알림이 아니라 운영 발송 테스트입니다.\n"
                  "본문의 예매/해지 링크는 테스트용이므로 동작 확인 대상으로 사용하지 마세요.\n\n"
                  + original
              )
              messages.append(message)

          with smtplib.SMTP_SSL(
              os.getenv("SMTP_HOST", "smtp.gmail.com"),
              int(os.getenv("SMTP_PORT", "465")),
              timeout=30,
          ) as smtp:
              smtp.login(sender, password)
              for message in messages:
                  smtp.send_message(message)

          print("OWNER ALERT E2E TEST PASS")
          print("odyssey_test_email=sent")
          print("spiderman_test_email=sent")
          print("emails_sent=2")
          PY
