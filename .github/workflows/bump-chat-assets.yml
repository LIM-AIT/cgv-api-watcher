name: Refresh Chat Assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bump-chat-assets.yml"

permissions:
  contents: write

jobs:
  bump-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump chat asset cache version
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace('./chat.css?v=1', './chat.css?v=2')
          text = text.replace('./chat.js?v=1', './chat.js?v=2')
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html

          if ! git diff --cached --quiet; then
            git commit -m "Refresh realtime chat assets [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          else
            echo "Chat asset version already refreshed."
          fi
