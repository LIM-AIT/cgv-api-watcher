name: Attach Header Instagram V1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/attach-header-instagram-v1.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Attach header Instagram v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Attach Instagram header script
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          old = '  <script src="./refresh-icon-ui.js?v=2"></script>\n</body>'
          new = '  <script src="./refresh-icon-ui.js?v=2"></script>\n  <script src="./header-instagram.js?v=1"></script>\n</body>'
          if './header-instagram.js?v=1' not in text:
              if old not in text:
                  raise SystemExit('index footer script anchor not found')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Attach Instagram link to header [skip ci]"
            git push origin HEAD:main
          fi
