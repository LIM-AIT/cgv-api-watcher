name: Fix Targeted Unsubscribe Batching

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-target-unsubscribe.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix targeted unsubscribe batching'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch targeted unsubscribe handling
        run: |
          python - <<'PY'
          from pathlib import Path

          alerts = Path("docs/alerts.js")
          text = alerts.read_text(encoding="utf-8")

          if "function parseTargetActionValues" not in text:
              marker = "\nfunction removeActionParams() {"
              addition = '''

function parseTargetActionValues(value) {
  return String(value || "")
    .split(",")
    .map((item) => parseTargetActionValue(item))
    .filter(Boolean);
}
'''
              if marker not in text:
                  raise SystemExit("removeActionParams marker not found")
              text = text.replace(marker, addition + marker, 1)

          text = text.replace(
              '''  const targetUnsubscribe = parseTargetActionValue(
    params.get("email_unsubscribe_target"),
  );''',
              '''  const targetUnsubscribes = parseTargetActionValues(
    params.get("email_unsubscribe_target"),
  );''',
              1,
          )

          start_marker = "  if (targetUnsubscribe) {"
          end_marker = "\n  if (unsubscribes.length) {"
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              replacement = '''  if (targetUnsubscribes.length) {
    const targetKey = targetUnsubscribes[0].targetKey;
    const sameTarget = targetUnsubscribes.filter(
      (item) => item.targetKey === targetKey,
    );
    const info = TARGETS[targetKey];
    setAlertStatus(`${info.label} 알림을 해지하고 있습니다.`, "pending");
    const results = await Promise.all(
      sameTarget.map(({ id, token }) =>
        supabase.rpc("unsubscribe_cgv_email_subscription_target", {
          p_id: id,
          p_token: token,
          p_target_key: targetKey,
        }),
      ),
    );
    const succeeded = results.some(
      (result) => !result.error && result.data === true,
    );
    if (succeeded) {
      setAlertStatus(`${info.label} 이메일 알림이 해지되었습니다.`, "success");
    } else {
      setAlertStatus(
        "해지 링크가 유효하지 않거나 이미 해지된 알림입니다.",
        "error",
      );
    }
    removeActionParams();
    return;
  }
'''
              text = text[:start] + replacement + text[end:]
          elif "if (targetUnsubscribes.length)" not in text:
              raise SystemExit("target unsubscribe handler not found")

          if "targetUnsubscribe =" in text:
              raise SystemExit("old target unsubscribe declaration remains")

          alerts.write_text(text, encoding="utf-8")

          index = Path("docs/index.html")
          html = index.read_text(encoding="utf-8")
          if './alerts.js?v=4' in html:
              html = html.replace('./alerts.js?v=4', './alerts.js?v=5', 1)
          index.write_text(html, encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/alerts.js docs/index.html
          git commit -m "Handle targeted unsubscribe batches [skip ci]"
          git push origin HEAD:main
