name: Refresh Chat Admin Assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bump-chat-admin-assets.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump chat assets
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              './chat.css?v=5': './chat.css?v=6',
              './chat.js?v=4': './chat.js?v=5',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'asset reference not found: {old}')
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh chat admin assets [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          fi
