name: Test Self Mail

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-self-mail.yml"

permissions:
  contents: read

jobs:
  send-test-mail:
    runs-on: ubuntu-latest
    steps:
      - name: Send test alert to SMTP user only
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          sender = os.environ["SMTP_USER"].strip()
          password = os.environ["SMTP_APP_PASSWORD"].replace(" ", "")

          booking_url = (
              "https://cgv.co.kr/cnm/movieBook/movie?"
              "movNo=30001323&scnYmd=20260825&"
              "siteNm=CGV+%EC%9A%A9%EC%82%B0%EC%95%84%EC%9D%B4%ED%8C%8C%ED%81%AC%EB%AA%B0&"
              "siteNo=0013"
          )

          message = EmailMessage()
          message["From"] = sender
          message["To"] = sender
          message["Subject"] = "[TEST] CGV IMAX 오디세이 알림 테스트"
          message.set_content(
              "CGV IMAX 이메일 알림 기능 테스트입니다.\n\n"
              "극장: 용산아이파크몰\n"
              "날짜: 08/25(화)\n"
              "영화: 오디세이\n\n"
              "오디세이 IMAX 바로 예매하기:\n"
              f"{booking_url}\n\n"
              "이 메일은 테스트용이며 구독자에게는 발송되지 않았습니다."
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(sender, password)
              smtp.send_message(message)

          print("Test mail sent successfully to SMTP_USER.")
          PY
