name: Bump Layout Order V5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bump-layout-order-v5.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump layout-order cache version
        run: |
          sed -i 's#./layout-order.js?v=4#./layout-order.js?v=5#' docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Bump layout order cache to v5 [skip ci]"
          git push origin HEAD:main
