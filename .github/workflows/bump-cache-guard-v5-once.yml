name: Bump cache guard v5 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-cache-guard-v5-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache guard and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/app.html')
          text = p.read_text()
          old = './app-cache-guard.js?v=4'
          new = './app-cache-guard.js?v=5'
          if old not in text:
              raise SystemExit(f'Expected reference not found: {old}')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/bump-cache-guard-v5-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.html .github/workflows/bump-cache-guard-v5-once.yml
          git commit -m "Load smooth cache guard v5"
          git pull --rebase origin main
          git push origin HEAD:main
