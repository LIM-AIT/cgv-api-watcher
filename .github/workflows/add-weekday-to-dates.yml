name: Add Weekday To Dates

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-weekday-to-dates.yml"

permissions:
  contents: write

jobs:
  update-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Korean weekday labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")

          pattern = r'    function formatDate\(value\) \{\n      if \(!value\) return "-";\n      const \[, month, day\] = value\.split\("-"\);\n      return month && day \? `\$\{month\}/\$\{day\}` : value;\n    \}\n'
          replacement = '    function formatDate(value) {\n      if (!value) return "-";\n\n      const [year, month, day] = value.split("-");\n      if (!year || !month || !day) return value;\n\n      const weekdays = ["일", "월", "화", "수", "목", "금", "토"];\n      const parsed = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day)));\n      const weekday = weekdays[parsed.getUTCDay()] || "";\n\n      return `${month}/${day} ${weekday}`;\n    }\n'

          updated, count = re.subn(pattern, lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit("formatDate function was not found")
          text = updated

          css = '\n    /* weekday date label mobile fit v1 */\n    @media (max-width: 640px) {\n      .result-row {\n        grid-template-columns: 62px minmax(0, 1fr) auto !important;\n      }\n\n      .result-date {\n        font-size: 11px !important;\n        letter-spacing: -0.02em !important;\n        white-space: nowrap !important;\n      }\n    }\n'
          if "weekday date label mobile fit v1" not in text:
              text = text.replace("  </style>", css + "\n  </style>", 1)

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html

          if ! git diff --cached --quiet; then
            git commit -m "Show Korean weekdays next to dates [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          else
            echo "Weekday labels already applied."
          fi
