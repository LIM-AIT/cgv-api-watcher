name: Bootstrap Alert Encryption Key

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-alert-key.yml"

permissions:
  contents: write

jobs:
  bootstrap-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cryptography
        run: pip install cryptography==45.0.6

      - name: Generate public key and encrypted private key
        env:
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          password = os.environ.get("SMTP_APP_PASSWORD", "").replace(" ", "").strip()
          if not password:
              raise SystemExit("SMTP_APP_PASSWORD secret is required")

          public_path = Path("docs/alert-public-key.jwk")
          encrypted_path = Path(".github/secure/alert-private-key.enc.json")

          if public_path.exists() and encrypted_path.exists():
              print("Alert encryption key already exists.")
              raise SystemExit(0)

          private_key = rsa.generate_private_key(public_exponent=65537, key_size=3072)
          public_numbers = private_key.public_key().public_numbers()

          def b64url_int(value: int) -> str:
              raw = value.to_bytes((value.bit_length() + 7) // 8, "big")
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode("ascii")

          public_jwk = {
              "kty": "RSA",
              "n": b64url_int(public_numbers.n),
              "e": b64url_int(public_numbers.e),
              "alg": "RSA-OAEP-256",
              "ext": True,
              "key_ops": ["encrypt"],
          }

          private_pem = private_key.private_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption(),
          )

          salt = os.urandom(16)
          nonce = os.urandom(12)
          kdf = PBKDF2HMAC(
              algorithm=hashes.SHA256(),
              length=32,
              salt=salt,
              iterations=600_000,
          )
          key = kdf.derive(password.encode("utf-8"))
          ciphertext = AESGCM(key).encrypt(nonce, private_pem, b"cgv-email-alert-private-key-v1")

          encrypted_payload = {
              "version": 1,
              "kdf": "PBKDF2-HMAC-SHA256",
              "iterations": 600000,
              "cipher": "AES-256-GCM",
              "salt": base64.b64encode(salt).decode("ascii"),
              "nonce": base64.b64encode(nonce).decode("ascii"),
              "ciphertext": base64.b64encode(ciphertext).decode("ascii"),
          }

          public_path.parent.mkdir(parents=True, exist_ok=True)
          encrypted_path.parent.mkdir(parents=True, exist_ok=True)
          public_path.write_text(json.dumps(public_jwk, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          encrypted_path.write_text(json.dumps(encrypted_payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit generated key material
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/alert-public-key.jwk .github/secure/alert-private-key.enc.json

          if ! git diff --cached --quiet; then
            git commit -m "Add encrypted email subscriber key material [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          else
            echo "No key material changes."
          fi
