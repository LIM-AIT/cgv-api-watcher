name: Attach Refresh Icon UI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/attach-refresh-icon-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Attach refresh icon UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Attach refresh icon UI asset
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")
          asset = '  <script src="./refresh-icon-ui.js?v=1"></script>\n'
          if asset not in text:
              marker = '  <script src="./layout-order.js?v=9"></script>\n'
              if marker not in text:
                  raise SystemExit("layout-order v9 marker not found")
              text = text.replace(marker, marker + asset, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit page asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Use compact refresh icon UI [skip ci]"
            git push origin HEAD:main
          fi
