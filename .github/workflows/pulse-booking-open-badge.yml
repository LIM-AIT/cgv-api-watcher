name: Pulse Booking Open Badge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pulse-booking-open-badge.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add booking-open pulse effect
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')
          old_guard = '      if (!label || !dot) return;\n\n      if (badge) {'
          new_guard = '      if (!label || !dot) return;\n\n      dot.classList.remove("opening-pulse");\n      badge?.classList.remove("booking-open");\n\n      if (badge) {'
          if old_guard in text:
              text = text.replace(old_guard, new_guard, 1)
          elif 'dot.classList.remove("opening-pulse")' not in text:
              raise SystemExit('status guard block not found')
          old_open = '      if (data.status === "OPEN") {\n        label.textContent = "예매 오픈 감지";\n        dot.style.background = "var(--open)";\n        return;\n      }'
          new_open = '      if (data.status === "OPEN") {\n        label.textContent = "예매 오픈 감지";\n        dot.style.background = "var(--open)";\n        dot.classList.add("opening-pulse");\n        badge?.classList.add("booking-open");\n        return;\n      }'
          if old_open in text:
              text = text.replace(old_open, new_open, 1)
          elif 'dot.classList.add("opening-pulse")' not in text:
              raise SystemExit('OPEN status block not found')
          marker = '/* booking open badge pulse v1 */'
          if marker not in text:
              css = '\n    /* booking open badge pulse v1 */\n    .health-badge.booking-open .health-dot.opening-pulse {\n      background: var(--open) !important;\n      box-shadow: 0 0 15px var(--open) !important;\n      animation: pulse 1.8s ease-in-out infinite;\n    }\n\n    .health-badge.booking-open #service-status {\n      color: #7ee787;\n    }\n'
              text = text.replace('</style>', css + '\n  </style>', 1)
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Pulse booking open status badge [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          fi
