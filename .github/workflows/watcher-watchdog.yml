name: CGV Watcher Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cgv-watcher-watchdog
  cancel-in-progress: true

jobs:
  ensure-watcher-running:
    runs-on: ubuntu-latest
    steps:
      - name: Restart watcher only when no active session exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          runs_json="$(curl --fail-with-body --retry 3 --retry-delay 5 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/runs?per_page=20")"

          active_count="$(printf '%s' "$runs_json" | python -c '
          import json, sys
          data = json.load(sys.stdin)
          active = {"queued", "in_progress", "pending", "waiting", "requested"}
          print(sum(1 for run in data.get("workflow_runs", []) if run.get("status") in active))
          ')"

          if [ "$active_count" -gt 0 ]; then
            echo "CGV Watcher already has an active session; no action needed."
            exit 0
          fi

          echo "No active CGV Watcher session found. Starting one recovery session."
          curl --fail-with-body --retry 3 --retry-delay 5 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/watch.yml/dispatches" \
            --data '{"ref":"main"}'
