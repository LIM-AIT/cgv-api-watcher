name: One-time email dedupe UI patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/once-email-dedupe-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/once-email-dedupe-ui.yml
          git add -A
          git commit -m "Support duplicate email management links [skip ci]"
          git push
