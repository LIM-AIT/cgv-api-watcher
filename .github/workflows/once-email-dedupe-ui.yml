name: One-time email dedupe UI patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/once-email-dedupe-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch email alert management flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/alerts.js")
          text = path.read_text(encoding="utf-8")

          replacements = []

          replacements.append((
          '''    setAlertStatus(
                `등록 요청 완료 · ${targetInfo().label} 확인 메일은 보통 1분 이내 도착합니다. 메일의 확인 링크를 눌러주세요.`,
                "success",
              );''',
          '''    setAlertStatus(
                `등록 요청 완료 · ${targetInfo().label} 확인 또는 알림 관리 메일은 보통 1분 이내 도착합니다. 이미 등록된 이메일은 중복 생성하지 않습니다. 메일의 링크를 눌러주세요.`,
                "success",
              );'''
          ))

          replacements.append((
          '''  url.searchParams.delete("email_unsubscribe_target");
            history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);''',
          '''  url.searchParams.delete("email_unsubscribe_target");
            url.searchParams.delete("email_manage_target");
            history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);'''
          ))

          replacements.append((
          '''  const targetUnsubscribe = parseTargetActionValue(
              params.get("email_unsubscribe_target"),
            );''',
          '''  const targetUnsubscribe = parseTargetActionValue(
              params.get("email_unsubscribe_target"),
            );
            const manageTarget = parseTargetActionValue(
              params.get("email_manage_target"),
            );'''
          ))

          old_verify = '''  if (verify) {
              setAlertStatus("이메일 알림 등록을 확인하고 있습니다.", "pending");
              const { data, error } = await supabase.rpc(
                "confirm_cgv_email_subscription",
                { p_id: verify.id, p_token: verify.token },
              );
              const alreadyVerified =
                !error && data !== true
                  ? (await getSubscriptionStatus(verify.id, verify.token)) === "verified"
                  : false;

              if (!error && (data === true || alreadyVerified)) {
                const saved = readSavedSubscription();
                saveSubscription({
                  ...(saved?.id === verify.id ? saved : {}),
                  id: verify.id,
                  token: verify.token,
                  verified: true,
                });
                setAlertStatus("✅ 이메일 알림 등록 완료", "success");
              } else {
                setAlertStatus("확인 링크가 유효하지 않거나 이미 처리된 요청입니다.", "error");
              }
              removeActionParams();
              return;
            }
'''

          new_verify = '''  if (verify) {
              setAlertStatus("이메일 알림 등록을 확인하고 있습니다.", "pending");
              const { data, error } = await supabase.rpc(
                "confirm_cgv_email_subscription",
                { p_id: verify.id, p_token: verify.token },
              );
              const alreadyVerified =
                !error && data !== true
                  ? (await getSubscriptionStatus(verify.id, verify.token)) === "verified"
                  : false;

              if (!error && (data === true || alreadyVerified)) {
                let completedLabel = "이메일 알림";
                if (
                  manageTarget &&
                  manageTarget.id === verify.id &&
                  manageTarget.token === verify.token
                ) {
                  const targetResult = await supabase.rpc(
                    "add_cgv_email_subscription_target",
                    {
                      p_id: manageTarget.id,
                      p_token: manageTarget.token,
                      p_target_key: manageTarget.targetKey,
                    },
                  );
                  if (targetResult.error || targetResult.data !== true) {
                    setAlertStatus(
                      "이메일 인증은 완료됐지만 알림 추가에 실패했습니다. 잠시 후 다시 시도해주세요.",
                      "error",
                    );
                    removeActionParams();
                    return;
                  }
                  completedLabel = TARGETS[manageTarget.targetKey].label;
                }

                const saved = readSavedSubscription();
                saveSubscription({
                  ...(saved?.id === verify.id ? saved : {}),
                  id: verify.id,
                  token: verify.token,
                  verified: true,
                });
                setAlertStatus(`✅ ${completedLabel} 등록 완료`, "success");
              } else {
                setAlertStatus("확인 링크가 유효하지 않거나 이미 처리된 요청입니다.", "error");
              }
              removeActionParams();
              return;
            }

            if (manageTarget) {
              const info = TARGETS[manageTarget.targetKey];
              setAlertStatus(`${info.label} 알림을 확인하고 있습니다.`, "pending");
              const { data, error } = await supabase.rpc(
                "add_cgv_email_subscription_target",
                {
                  p_id: manageTarget.id,
                  p_token: manageTarget.token,
                  p_target_key: manageTarget.targetKey,
                },
              );
              if (!error && data === true) {
                saveSubscription({
                  id: manageTarget.id,
                  token: manageTarget.token,
                  verified: true,
                  targetKey: manageTarget.targetKey,
                  registeredAt: new Date().toISOString(),
                });
                setAlertStatus(`✅ ${info.label} 이메일 알림 등록 완료`, "success");
              } else {
                setAlertStatus(
                  "알림 관리 링크가 유효하지 않거나 처리할 수 없습니다.",
                  "error",
                );
              }
              removeActionParams();
              return;
            }
'''
          replacements.append((old_verify, new_verify))

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected exactly one match, found {count}: {old[:80]!r}"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch and remove helper
        run: |
          rm -f .github/workflows/once-email-dedupe-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/alerts.js .github/workflows/once-email-dedupe-ui.yml
          git commit -m "Support duplicate email management links [skip ci]"
          git push
