name: Compact Mobile Booking Button

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compact-mobile-booking-button.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep mobile booking action on one row
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")

          old = (
              "    @media (max-width: 520px) {\n"
              "      .result-actions {\n"
              "        grid-column: 2;\n"
              "        justify-self: start;\n"
              "        margin-top: -2px;\n"
              "      }\n\n"
              "      .result-actions .imax-count {\n"
              "        grid-column: auto;\n"
              "        margin-top: 0;\n"
              "      }\n"
              "    }\n"
          )

          new = (
              "    @media (max-width: 520px) {\n"
              "      .result-row {\n"
              "        grid-template-columns: 62px minmax(0, 1fr) auto !important;\n"
              "        gap: 7px !important;\n"
              "      }\n\n"
              "      .result-main {\n"
              "        min-width: 0;\n"
              "      }\n\n"
              "      .status-line {\n"
              "        gap: 6px;\n"
              "      }\n\n"
              "      .status-label {\n"
              "        font-size: 13px;\n"
              "      }\n\n"
              "      .result-actions {\n"
              "        grid-column: 3 !important;\n"
              "        justify-self: end !important;\n"
              "        align-self: center;\n"
              "        margin-top: 0 !important;\n"
              "        gap: 0;\n"
              "      }\n\n"
              "      .result-booking-link {\n"
              "        min-height: 24px;\n"
              "        padding: 3px 7px;\n"
              "        border-radius: 8px;\n"
              "        font-size: 10px;\n"
              "        line-height: 1;\n"
              "      }\n"
              "    }\n"
          )

          if old in text:
              text = text.replace(old, new, 1)
          elif "grid-template-columns: 62px minmax(0, 1fr) auto !important;" not in text:
              raise SystemExit("mobile booking CSS block not found")

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Compact mobile booking action [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          fi
