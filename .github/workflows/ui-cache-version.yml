name: UI cache version

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/app.html'
      - 'docs/*.js'
      - 'docs/*.css'

permissions:
  contents: write

concurrency:
  group: ui-cache-version
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update UI version marker
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA:0:12}"
          printf '{\n  "version": "%s"\n}\n' "$VERSION" > docs/app-version.json

          if git diff --quiet -- docs/app-version.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app-version.json
          git commit -m "Update UI cache version [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
