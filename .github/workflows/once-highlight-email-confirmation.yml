name: One-time email confirmation copy styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/once-highlight-email-confirmation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Separate and highlight email confirmation notice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('docs/alerts.js')
          css_path = Path('docs/alerts.css')
          app_path = Path('docs/app.html')

          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          app = app_path.read_text(encoding='utf-8')

          js, count = re.subn(
              r'(?m)^\s*const description = panel\.querySelector\("\.imax-email-alert-copy p"\);$',
              '  const description = panel.querySelector(".imax-email-alert-description");\n  const confirmation = panel.querySelector(".imax-email-alert-confirmation");',
              js,
              count=1,
          )
          if count != 1:
              raise SystemExit('description query anchor not found')

          js, count = re.subn(
              r'(?ms)^\s*if \(description\) \{\s*description\.textContent =\s*`\$\{info\.description\} 등록 완료를 위해 확인 메일의 링크를 한 번 눌러주세요\.`;\s*\}',
              '  if (description) description.textContent = info.description;\n  if (confirmation) {\n    confirmation.textContent =\n      "등록 완료를 위해 확인 메일의 링크를 한 번 눌러주세요.";\n  }',
              js,
              count=1,
          )
          if count != 1:
              raise SystemExit('description copy anchor not found')

          js, count = re.subn(
              r'(?m)^\s*<p>\$\{targetInfo\(\)\.description\} 등록 완료를 위해 확인 메일의 링크를 한 번 눌러주세요\.</p>$',
              '      <p>\n        <span class="imax-email-alert-description">${targetInfo().description}</span>\n        <span class="imax-email-alert-confirmation">등록 완료를 위해 확인 메일의 링크를 한 번 눌러주세요.</span>\n      </p>',
              js,
              count=1,
          )
          if count != 1:
              raise SystemExit('alert panel markup anchor not found')

          if '.imax-email-alert-confirmation {' in css:
              raise SystemExit('confirmation CSS already present')
          css = css.rstrip() + "\n\n.imax-email-alert-confirmation {\n  display: block;\n  margin-top: 2px;\n  color: #e3b341;\n  font-weight: 800;\n}\n"

          if './alerts.css?v=3' not in app:
              raise SystemExit('alerts.css v3 reference not found')
          if './alerts.js?v=8' not in app:
              raise SystemExit('alerts.js v8 reference not found')
          app = app.replace('./alerts.css?v=3', './alerts.css?v=4', 1)
          app = app.replace('./alerts.js?v=8', './alerts.js?v=9', 1)

          js_path.write_text(js, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          app_path.write_text(app, encoding='utf-8')
          PY

          node --check docs/alerts.js
          grep -q 'imax-email-alert-confirmation' docs/alerts.js
          grep -q 'color: #e3b341' docs/alerts.css
          grep -q 'alerts.css?v=4' docs/app.html
          grep -q 'alerts.js?v=9' docs/app.html

      - name: Publish and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/alerts.js docs/alerts.css docs/app.html
          git commit -m "Highlight email confirmation instruction"
          git pull --rebase origin main
          git push origin HEAD:main

          git pull --rebase origin main
          rm -f .github/workflows/once-highlight-email-confirmation.yml
          git add -A
          git commit -m "Remove email confirmation styling helper [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
