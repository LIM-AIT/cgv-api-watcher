name: Bootstrap Multi Watcher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-multi-watcher.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Bootstrap multi-movie watcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python
        run: |
          python -m py_compile run_multi_special.py
          python -m py_compile src/cgv_imax_watcher/subscriber_mailer_v3.py

      - name: Export current multi-movie status
        env:
          THEATERS: ${{ secrets.THEATERS }}
          REQUEST_TIMEOUT_SECONDS: "20"
        run: python run_multi_special.py

      - name: Bump dashboard assets and generic header
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")
          text = text.replace('./alerts.js?v=3', './alerts.js?v=4')
          text = text.replace('./layout-order.js?v=6', './layout-order.js?v=7')
          for old in (
              'CGV IMAX Spider-Man',
              'CGV IMAX 오디세이',
              'CGV IMAX The Odyssey',
              'CGV API Watcher',
          ):
              text = text.replace(old, 'CGV WATCHER')
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit bootstrap output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Enable Odyssey and Spider-Man selector [skip ci]"
            git push origin HEAD:main
          fi
