name: Bump cache guard v4 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump cache guard to v4 and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/app-cache-guard.js?v=3/app-cache-guard.js?v=4/g' docs/app.html
          rm -f .github/workflows/bump-cache-guard-v4-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.html .github/workflows/bump-cache-guard-v4-once.yml
          git commit -m "Load cache guard v4"
          git pull --rebase origin main
          git push origin HEAD:main
