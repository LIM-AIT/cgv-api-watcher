name: Bump Verified Alert UI V2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bump-verified-alert-ui-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Bump verified alert UI v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump verified alert UI cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")
          old = './alerts-verified-ui.js?v=1'
          new = './alerts-verified-ui.js?v=2'
          if old not in text and new not in text:
              raise SystemExit("verified alert UI asset not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Use verified alert UI v2 [skip ci]"
            git push origin HEAD:main
          fi
