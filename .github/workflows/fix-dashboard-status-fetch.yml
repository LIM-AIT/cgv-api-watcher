name: Fix Dashboard Status Fetch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-dashboard-status-fetch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace GitHub REST status fetch with resilient static fetch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")

          old = '''        const response = await fetch(
          `https://api.github.com/repos/LIM-AIT/cgv-api-watcher/contents/docs/status.json?ref=main&timestamp=${Date.now()}`,
          {
            cache: "no-store",
            headers: {
              Accept: "application/vnd.github.raw+json",
            },
          },
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
'''

          new = '''        const statusUrls = [
          `./status.json?timestamp=${Date.now()}`,
          `${RAW_STATUS_URL}?timestamp=${Date.now()}`,
        ];

        let data = null;
        let lastError = null;

        for (const url of statusUrls) {
          try {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) {
              lastError = new Error(`HTTP ${response.status}`);
              continue;
            }

            data = await response.json();
            break;
          } catch (error) {
            lastError = error;
          }
        }

        if (!data) {
          throw lastError || new Error("상태 데이터 요청 실패");
        }
'''

          if old not in text:
              if 'const statusUrls = [' in text:
                  print('Status fetch is already patched.')
              else:
                  raise SystemExit('Target status fetch block not found')
          else:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Avoid GitHub REST rate limits for dashboard status [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          fi
