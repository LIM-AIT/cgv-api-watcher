name: Fix Dashboard Status Fetch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-dashboard-status-fetch.yml"
      - ".github/scripts/fix_status_fetch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch status fetch
        run: python .github/scripts/fix_status_fetch.py

      - name: Commit dashboard fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Avoid GitHub REST rate limits for dashboard status [skip ci]"
            git push origin HEAD:main
          fi
