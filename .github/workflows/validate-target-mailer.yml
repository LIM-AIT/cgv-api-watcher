name: Validate Target Mailer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-target-mailer.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message == 'Run mailer dry validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate targeted mailer without sending mail
        env:
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python .github/scripts/dry_run_target_mailer.py
