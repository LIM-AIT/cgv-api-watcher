name: One-time add multiple email registration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/once-add-multiple-email-registration.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch alert UI safely
        run: |
          printf '%s' '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          node --check docs/alerts.js
          grep -q 'alerts.js?v=6' docs/app.html
          grep -q 'imax-email-alert-additional-button' docs/alerts.js

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add docs/alerts.js docs/app.html
          git commit -m "Add additional email alert registration"
          git push

          git pull --rebase origin main
          rm -f .github/workflows/once-add-multiple-email-registration.yml
          git add -A
          git commit -m "Remove one-time email registration workflow [skip ci]"
          git push
