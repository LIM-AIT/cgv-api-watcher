name: Refine Header Status Badge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refine-header-status-badge.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Refine status badge behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace('<span id="service-status">불러오는 중</span>', '<span id="service-status">연결 확인 중</span>', 1)

          pattern = re.compile(r'    function updateServiceStatus\(data\) \{.*?\n    \}\n', re.S)
          replacement = (
              '    function updateServiceStatus(data) {\n'
              '      const label = document.getElementById("service-status");\n'
              '      const dot = document.getElementById("service-dot");\n'
              '      const badge = label?.parentElement;\n\n'
              '      if (!label || !dot) return;\n\n'
              '      if (badge) {\n'
              '        badge.style.borderColor = "rgba(63, 185, 80, 0.34)";\n'
              '        badge.style.background = "rgba(63, 185, 80, 0.08)";\n'
              '      }\n\n'
              '      if (data.status === "OPEN") {\n'
              '        label.textContent = "예매 오픈 감지";\n'
              '        dot.style.background = "var(--open)";\n'
              '        return;\n'
              '      }\n\n'
              '      if (data.status === "DEGRADED") {\n'
              '        label.textContent = "일부 조회 오류";\n'
              '        dot.style.background = "var(--error)";\n'
              '        if (badge) {\n'
              '          badge.style.borderColor = "rgba(248, 81, 73, 0.34)";\n'
              '          badge.style.background = "rgba(248, 81, 73, 0.08)";\n'
              '        }\n'
              '        return;\n'
              '      }\n\n'
              '      label.textContent = "정상 감시 중";\n'
              '      dot.style.background = "var(--open)";\n'
              '    }\n'
          )

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('updateServiceStatus block not found')

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refine header monitoring status badge [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          fi
