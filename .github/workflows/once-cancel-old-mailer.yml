name: One-time subscriber mailer rollover

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/once-cancel-old-mailer.yml

permissions:
  actions: write
  contents: read

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous long-running mailer session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31791346797/cancel"
