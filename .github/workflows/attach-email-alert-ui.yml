name: Attach Email Alert UI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/attach-email-alert-ui.yml"

permissions:
  contents: write

jobs:
  attach-alert-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Attach alert assets
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/index.html")
          text = path.read_text(encoding="utf-8")

          if 'href="./alerts.css?v=1"' not in text:
              text = text.replace(
                  "</head>",
                  '  <link rel="stylesheet" href="./alerts.css?v=1">\n</head>',
                  1,
              )

          if 'src="./alerts.js?v=1"' not in text:
              text = text.replace(
                  "</body>",
                  '  <script type="module" src="./alerts.js?v=1"></script>\n</body>',
                  1,
              )

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html

          if ! git diff --cached --quiet; then
            git commit -m "Attach email alert registration UI [skip ci]"
            git push origin HEAD:main || {
              git pull --rebase origin main
              git push origin HEAD:main
            }
          else
            echo "Email alert assets are already attached."
          fi
