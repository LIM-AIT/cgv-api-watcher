name: Install cache guard once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-cache-guard-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dashboard cache handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')

          if 'http-equiv="Cache-Control"' not in text:
              marker = '  <meta name="description" content="CGV IMAX 예매 오픈 감시 대시보드">'
              cache_meta = '''  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n  <meta http-equiv="Pragma" content="no-cache">\n  <meta http-equiv="Expires" content="0">\n'''
              text = text.replace(marker, cache_meta + marker, 1)

          if 'app-cache-guard.js' not in text:
              text = text.replace(
                  '</head>',
                  '  <script defer src="./app-cache-guard.js?v=1"></script>\n</head>',
                  1,
              )

          text = text.replace(
              '<script src="./header-instagram.js?v=2"></script>',
              '<script src="./header-instagram.js?v=3"></script>',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/install-cache-guard-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html .github/workflows/install-cache-guard-once.yml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Install mobile cache guard"
          git pull --rebase origin main
          git push origin HEAD:main
