name: CGV Subscriber Mailer Watchdog

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Subscriber mailer watchdog paused
        run: |
          echo "CGV subscriber mailer watchdog is paused."
          echo "It will not automatically restart the subscriber mailer."
